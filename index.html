<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#1E2230; --ink-soft:#666B7A; --border:#E4E6EE;
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-soft:#EEF0FF;
  --green:#1F9D6F; --green-soft:#E6F6EF; --red:#E0483E; --red-soft:#FDECEA;
  --amber:#C9810A; --amber-soft:#FBF1DE;
  --radius:16px; --radius-sm:11px;
  --shadow:0 1px 2px rgba(16,24,40,0.04), 0 6px 16px rgba(16,24,40,0.06);
  --font-display:'IBM Plex Sans',-apple-system,sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
  --input-bg:#FAFBFD;
}
[data-theme="dark"]{
  --bg:#13151F; --surface:#1B1E2B; --ink:#EDEEF5; --ink-soft:#9AA0B4; --border:#2A2E40;
  --primary:#7C7AFF; --primary-dark:#9290FF; --primary-soft:#272650;
  --green:#3DCB8F; --green-soft:#163428; --red:#FF6B61; --red-soft:#3A1E1E;
  --amber:#E0A53D; --amber-soft:#3A2E12;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
  --input-bg:#22253A;
}
[data-theme="dark"] body{ background:var(--bg); }
[data-theme="dark"] .login-card input,
[data-theme="dark"] .form-grid input, [data-theme="dark"] .form-grid select, [data-theme="dark"] .form-grid textarea{
  background:var(--input-bg); color:var(--ink); border-color:var(--border);
}
[data-theme="dark"] .id-card{ color:#1E2230; } /* printed ID cards stay light/printable regardless of theme */
[data-theme="dark"] .table th, [data-theme="dark"] .att-split-head{ background:var(--surface); }
[data-theme="dark"] .att-list-row:hover{ background:var(--bg); }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body); color:var(--ink); background:var(--bg); min-height:100vh;}
#app[data-font-size="large"]{zoom:1.15;}
#app[data-font-size="small"]{zoom:0.9;}
button,input,select,textarea{font-family:inherit; font-size:14px;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0 0 .4em 0; color:var(--ink);}
.mono{font-family:var(--font-mono);}
.muted{color:var(--ink-soft); font-size:13px;}
a{color:var(--primary);}

.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); padding:38px 34px; width:100%; max-width:420px;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-center{justify-content:center; flex-direction:column; text-align:center; margin-bottom:8px;}
.brand-mark{width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; flex-shrink:0; box-shadow:0 4px 10px rgba(79,70,229,.3);}
.brand-text{font-weight:800; font-size:19px; line-height:1.15;}
.login-tagline{text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 24px;}
.login-card label{display:block; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:16px;}
.login-card input{width:100%; margin-top:6px; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--input-bg); outline:none; font-size:15px; color:var(--ink);}
.login-card input:focus{border-color:var(--primary); background:#fff;}
.login-error{background:var(--red-soft); color:var(--red); border:1px solid #F6CFCB; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:16px;}
.login-hint{font-size:12px; color:var(--ink-soft); margin-top:16px; text-align:center; line-height:1.5;}
.loading-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--ink-soft);}
.loading-mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));}
.fatal-error{max-width:480px; margin:80px auto; text-align:center; padding:24px;}
.setup-note{background:var(--primary-soft); border:1px solid #D9D6FB; border-radius:10px; padding:10px 12px; font-size:12.5px; color:#41399A; line-height:1.5; margin-bottom:18px;}

.btn{border:none; border-radius:10px; padding:10px 17px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .05s ease, opacity .15s ease, background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.55; cursor:default;}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(79,70,229,.25);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:#fff; color:var(--ink); border:1.5px solid var(--border);}
.btn-secondary:hover{border-color:var(--primary); color:var(--primary);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid transparent;}
.btn-ghost:hover{color:var(--ink); background:#EEF0F4;}
.btn-danger{background:var(--red); color:#fff;}
.btn-amber{background:var(--amber); color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:14px 26px; font-size:16px;}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.link-btn{background:none; border:none; color:var(--primary); font-size:13px; cursor:pointer; padding:0; font-weight:600;}

.app-shell{display:flex; min-height:100vh;}
.sidebar{width:212px; flex-shrink:0; background:var(--ink); color:#fff; display:flex; flex-direction:column; padding:20px 0;}
.sidebar .brand{padding:0 20px 20px; color:#fff;}
.sidebar .brand-text{color:#fff;}
.nav-item{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:none; border:none; color:#A6ACC2; padding:11px 20px; font-size:14px; cursor:pointer; border-left:3px solid transparent; font-weight:500;}
.nav-item:hover{color:#fff; background:rgba(255,255,255,.05);}
.nav-item.active{color:#fff; background:rgba(255,255,255,.08); border-left-color:var(--primary); font-weight:700;}
.nav-badge{background:var(--red); color:#fff; font-size:10px; font-weight:800; border-radius:20px; padding:2px 7px;}
.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border-bottom:1px solid var(--border); padding:16px 26px; flex-wrap:wrap; gap:8px;}
.topbar-title{font-size:19px; font-weight:800;}
.topbar-user{display:flex; align-items:center; gap:11px; font-size:13px; flex-wrap:wrap;}
.role-badge{font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px; border-radius:20px; font-weight:700;}
.role-admin{background:var(--primary-soft); color:var(--primary-dark);}
.role-accountant{background:var(--green-soft); color:var(--green);}
.role-gatekeeper{background:var(--amber-soft); color:var(--amber);}
.role-viewer{background:#EEE; color:var(--ink-soft);}
.user-name{font-weight:700;}
.account-icon-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:14px; line-height:1;}
.account-icon-btn:hover{border-color:var(--primary); color:var(--primary);}
.main{padding:26px; overflow-y:auto;}
@media (max-width:760px){
  .app-shell{flex-direction:column;}
  .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:8px;}
  .sidebar .brand{display:none;}

<script>
/* ============================================================
   SUPABASE CONNECTION — fill these in once and re-upload the file.
   When both are filled in, EVERY browser/device that opens this
   file connects immediately — no setup screen, nothing to re-enter.
   Find these in Supabase: Project Settings → API.
   Leave both as '' to use the in-app setup screen instead
   (which remembers the connection per-browser via localStorage).
   ============================================================ */

const HARDCODED_SUPABASE_URL = 'https://dthsknsixkyyrkvfvtzi.supabase.co';
const HARDCODED_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0aHNrbnNpeGt5eXJrdmZ2dHppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjUyMDcsImV4cCI6MjA5Nzg0MTIwN30.gPmmlpdlxVc-FI7FrcBmkEPCE-ASS6-2Y-9_Q3mPpYA';
const ID_CARD_HINDI_TITLE = 'विद्या ग्राम छात्रावास';
const ID_CARD_DEFAULT_ADDRESS = 'Hasadih (Masaurhi) Patna';
/* ============================================================
   STATE
   ============================================================ */
let state = {
  view:'loading', sbUrl:null, sbAnonKey:null, user:null,
  students:[], accounts:[], activity:[], leaves:[], batches:[],
  batchMemberships:[], staffBatchAccess:[], selectedBatchId:'', assignmentCounts:{},
  studentsView:'active', sortBy:'name', duesFilter:'all', studentGroupView:false, studentsPage:1, studentsPageSize:60, regFrom:null, regTo:null,
  adminTab:'dashboard', accTab:'scan', gateTab:'gate', viewerTab:'dashboard',
  search:'', modal:null, scanResult:null, gateResult:null, scanning:false,

  leaveDateFrom:null, leaveDateTo:null, txnDateFrom:null, txnDateTo:null,
  myTxnDateFrom:null, myTxnDateTo:null,
  loginRequests:[], myLoginRequestId:null,
  attDate:null, attListView:false, attListSearch:'',
  openAssignmentId:null, openAssignmentName:null,
  theme:'light', fontSize:'normal', idCardAddress:'', idCardMobile:'', idCardWatermark:true, idPrintSide:'both', idPrintMirror:false, statusFilter:'all', roomFilter:'', studentAssignmentId:'', studentAssignmentReceipt:'any',_studentAssignmentRecords:null,_studentAssignmentsLoading:false, activityTypeFilter:'', activityFrom:'',activityTo:''
};
let session = null;
let html5QrCode = null;
let pendingConfirmCallback = null;
let approvalPollInterval = null;
let attendanceSessionResolved = new Set(); // codes already successfully marked OR known-already-marked — never bother the operator again this session
let attendancePending = new Set(); // codes currently mid-request, to avoid duplicate concurrent calls
let attendanceErrorCooldown = {}; // code -> timestamp, for retryable errors (not found, out of campus) so they don't spam every decode frame
let attendanceSessionCount = 0; // live tally for this scanning burst, shown without a full re-render
let assignmentSessionResolved = new Set(); // key = assignmentId:rollNo
let assignmentPending = new Set();
let assignmentErrorCooldown = {};
let assignmentSessionCount = 0;

/* ============================================================
   STORAGE LAYER (Claude artifact storage when previewing inside
   Claude.ai, otherwise localStorage for normal hosting)
   ============================================================ */
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);
function getOrCreateDeviceId(){
  try{
    let id = localStorage.getItem('hostel-device-id');
    if (!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('dev-'+Date.now()+'-'+Math.random().toString(36).slice(2));
      localStorage.setItem('hostel-device-id', id);
    }
    return id;
  }catch(e){ return 'dev-fallback-'+Date.now(); } // e.g. private browsing blocking localStorage — falls back to a session-only id, meaning this one session will need approval again next time, but nothing breaks
}
const DEVICE_ID = getOrCreateDeviceId();
async function storageGet(key, shared){
  if (hasClaudeStorage){ try{ const res = await window.storage.get(key, shared); return res ? res.value : null; }catch(e){ return null; } }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if (hasClaudeStorage){ try{ await window.storage.set(key, value, shared); }catch(e){} return; }
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function storageDelete(key, shared){
  if (hasClaudeStorage){ try{ await window.storage.delete(key, shared); }catch(e){} return; }
  try{ localStorage.removeItem(key); }catch(e){}
}

/* ============================================================
   SUPABASE REST HELPERS
   ============================================================ */
async function sbSignIn(email, password){
  const res = await fetch(`${state.sbUrl}/auth/v1/token?grant_type=password`, { method:'POST', headers:{ apikey:state.sbAnonKey, 'Content-Type':'application/json' }, body: JSON.stringify({ email, password }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed.');
  return data;
}
async function sbRefresh(refresh_token){
  const res = await fetch(`${state.sbUrl}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey:state.sbAnonKey, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token }) });
  const data = await res.json();
  if (!res.ok) throw new Error('Session expired.');
  return data;
}
let refreshPromise=null;
async function getValidAccessToken(){
  if(!session)throw new Error('Not signed in.');
  if(Date.now()>session.expires_at-30000){
    if(!refreshPromise) refreshPromise=(async()=>{
      try{
        const fresh=await sbRefresh(session.refresh_token);
        session={access_token:fresh.access_token,refresh_token:fresh.refresh_token,
          expires_at:Date.now()+fresh.expires_in*1000,user:fresh.user||session.user};
        await persistSession();
      }catch(e){await handleSessionExpired();throw new Error('__session_expired__');}
    })().finally(()=>{refreshPromise=null;});
    await refreshPromise;
  }
  return session.access_token;
}
async function handleSessionExpired(){
  stopCamera();
  if (approvalPollInterval){ clearInterval(approvalPollInterval); approvalPollInterval=null; }
  stopInactivityWatch();
  stopDeviceHeartbeat();
  await clearSession();
  purgeLocalStudentData();state.user=null;state.scanning=false;
  state.view = 'login';
  state.loginError = 'Your session expired — please log in again.';
  update();
}
async function sbRequest(path, opts){
  opts = opts || {};
  const token = await getValidAccessToken();
  const res = await fetch(`${state.sbUrl}/rest/v1${path}`, {
    method: opts.method || 'GET',
    headers: Object.assign({ apikey:state.sbAnonKey, Authorization:`Bearer ${token}`, 'Content-Type':'application/json', 'X-Device-Id':DEVICE_ID }, opts.headers||{}),
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
  });
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if (!res.ok){
    const msg = (data && (data.message || data.error_description || data.hint)) || (typeof data === 'string' ? data : 'Request failed.');
    throw new Error(msg);
  }
  return data;
}
function sbSelect(table, query){ return sbRequest(`/${table}${query||''}`); }
async function sbSelectAll(table, query, size=1000){
  const rows=[];
  for(let offset=0;offset<100000;offset+=size){
    const separator=String(query||'').includes('?')?'&':'?';
    const page=await sbSelect(table,`${query||''}${separator}limit=${size}&offset=${offset}`);
    if(!Array.isArray(page)) throw new Error('Expected a list from '+table);
    rows.push(...page);
    if(page.length<size) return rows;
  }
  throw new Error('The result is too large; please narrow the requested range.');
}
function sbInsert(table, row){ return sbRequest(`/${table}`, { method:'POST', body: row, headers:{ Prefer:'return=representation' } }); }
function sbUpdate(table, query, patch){ return sbRequest(`/${table}${query}`, { method:'PATCH', body: patch, headers:{ Prefer:'return=representation' } }); }
function sbUpsert(table, row, onConflict){ return sbRequest(`/${table}?on_conflict=${onConflict}`, { method:'POST', body: row, headers:{ Prefer:'resolution=merge-duplicates,return=representation' } }); }
function sbDelete(table, query){ return sbRequest(`/${table}${query}`, { method:'DELETE' }); }
function sbRpc(fn, params){ return sbRequest(`/rpc/${fn}`, { method:'POST', body: params }); }
async function sbUploadFile(bucket, path, file){
  const token = await getValidAccessToken();
  const res = await fetch(`${state.sbUrl}/storage/v1/object/${bucket}/${encodeURIComponent(path)}`, { method:'POST', headers:{ apikey:state.sbAnonKey, Authorization:`Bearer ${token}`, 'Content-Type': file.type||'application/octet-stream', 'x-upsert':'true', 'X-Device-Id':DEVICE_ID }, body: file });
  if (!res.ok){ const t = await res.text(); throw new Error('Photo upload failed: ' + t); }
  return path;
}
async function sbSignedUrl(bucket, path, expiresIn){
  const token = await getValidAccessToken();
  const res = await fetch(`${state.sbUrl}/storage/v1/object/sign/${bucket}/${encodeURIComponent(path)}`, { method:'POST', headers:{ apikey:state.sbAnonKey, Authorization:`Bearer ${token}`, 'Content-Type':'application/json', 'X-Device-Id':DEVICE_ID }, body: JSON.stringify({ expiresIn: expiresIn||3600 }) });
  if (!res.ok) return null;
  const data = await res.json();
  return data.signedURL ? `${state.sbUrl}/storage/v1${data.signedURL}` : null;
}
async function sbDownloadFile(bucket, path){
  const token = await getValidAccessToken();
  const res = await fetch(`${state.sbUrl}/storage/v1/object/${bucket}/${encodeURIComponent(path)}`, { headers:{ apikey:state.sbAnonKey, Authorization:`Bearer ${token}`, 'X-Device-Id':DEVICE_ID } });
  if (!res.ok) throw new Error('Could not download the existing photo.');
  return await res.blob();
}
async function sbDeleteFile(bucket, path){
  const token = await getValidAccessToken();
  try{ await fetch(`${state.sbUrl}/storage/v1/object/${bucket}/${encodeURIComponent(path)}`, { method:'DELETE', headers:{ apikey:state.sbAnonKey, Authorization:`Bearer ${token}`, 'X-Device-Id':DEVICE_ID } }); }catch(e){} // best-effort cleanup, never fatal
}
async function sbUpdateUserPassword(newPassword){
  const token = await getValidAccessToken();
  const res = await fetch(`${state.sbUrl}/auth/v1/user`, { method:'PUT', headers:{ apikey:state.sbAnonKey, Authorization:`Bearer ${token}`, 'Content-Type':'application/json' }, body: JSON.stringify({ password:newPassword }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Could not update password.');
  return data;
}

/* ============================================================
   CONFIG + SESSION
   ============================================================ */
async function loadConfig(){
  if (HARDCODED_SUPABASE_URL && HARDCODED_SUPABASE_ANON_KEY){
    state.sbUrl = HARDCODED_SUPABASE_URL.replace(/\/+$/,'');
    state.sbAnonKey = HARDCODED_SUPABASE_ANON_KEY;
    return;
  }
  try{ const raw = await storageGet('sb-config', true); if (raw){ const cfg = JSON.parse(raw); state.sbUrl = cfg.url; state.sbAnonKey = cfg.anonKey; } } catch(e){}
}
async function saveConfig(url, anonKey){
  state.sbUrl = url.replace(/\/+$/,''); state.sbAnonKey = anonKey;
  await storageSet('sb-config', JSON.stringify({ url:state.sbUrl, anonKey }), true);
}
async function persistSession(){ try{ await storageSet('sb-session', JSON.stringify(session), false); } catch(e){} }
async function loadPersistedSession(){ try{ const raw = await storageGet('sb-session', false); if (raw) session = JSON.parse(raw); } catch(e){ session = null; } }
async function clearSession(){ session = null; try{ await storageDelete('sb-session', false); } catch(e){} }
async function loadTheme(){
  try{ const t = await storageGet('theme', false); if (t==='dark'||t==='light'){ state.theme=t; document.documentElement.setAttribute('data-theme', t); } }catch(e){}
}
function toggleTheme(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  storageSet('theme', state.theme, false);
  update();
}
const FONT_SIZE_CYCLE = ['normal','large','small'];
async function loadFontSize(){
  try{ const f = await storageGet('font-size', false); if (FONT_SIZE_CYCLE.includes(f)) state.fontSize=f; }catch(e){}
}
function applyFontSizeAttr(){
  const app = document.getElementById('app');
  if (app) app.setAttribute('data-font-size', state.fontSize||'normal');
}
function cycleFontSize(){
  const idx = FONT_SIZE_CYCLE.indexOf(state.fontSize||'normal');
  state.fontSize = FONT_SIZE_CYCLE[(idx+1) % FONT_SIZE_CYCLE.length];
  applyFontSizeAttr();
  storageSet('font-size', state.fontSize, false);
  update();
}
function fontSizeIcon(){ return state.fontSize==='large' ? 'A+' : state.fontSize==='small' ? 'A-' : 'A'; }

/* ============================================================
   HELPERS
   ============================================================ */
function esc(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(str){ return String(str==null?'':str).replace(/\\/g,'\\\\').replace(/'/g,'\\x27').replace(/\r/g,'\\r').replace(/\n/g,'\\n').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function safeId(str){ return 'id'+String(str).replace(/[^a-zA-Z0-9]/g,'_'); }
function initials(name){ return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?'; }
function avatarColor(name){
  const colors=['#4F46E5','#1F9D6F','#E0483E','#0E7490','#7C3AED','#C9810A']; let hash=0; const s=String(name||'');
  for(let i=0;i<s.length;i++){ hash=(hash*31+s.charCodeAt(i))%colors.length; } return colors[Math.abs(hash)%colors.length];
}
function fmtTime(ts){ if(!ts) return '—'; return new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtMoney(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN'); }
function csvEscape(v){
 v = v==null?'':String(v);
 if(/^[\s]*[=+@]/.test(v)||/^[\s]*-[^0-9.]/.test(v))v="'"+v;
 if(/[",\n\r]/.test(v))return '"'+v.replace(/"/g,'""')+'"';
 return v;
}
function downloadTextFile(content, filename, mime){
  const blob = new Blob([content],{type:mime}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function parseContacts(raw){
  if (Array.isArray(raw)) return raw;
  if (typeof raw === 'string'){ try{ const p = JSON.parse(raw); return Array.isArray(p)?p:[]; }catch(e){ return []; } }
  return [];
}
function contactIconLabel(rawLabel){
  const label = (rawLabel||'').trim();
  const l = label.toLowerCase();
  if (l.includes('student') || l.includes('self')) return '📱 ' + (label||'Student');
  if (l.includes('guardian') || l.includes('parent') || l.includes('father') || l.includes('mother')) return '👤 ' + (label||'Guardian');
  return '👤 ' + (label || 'Contact');
}
function toTitleCase(str){
  if (!str) return str;
  return str.trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|[\s\-'.])([a-z])/g, (m,sep,ch)=> sep+ch.toUpperCase());
}
function hasPerm(p){ return !!(state.user && state.user.permissions && state.user.permissions[p]); }
function canDo(p){ return state.user && (state.user.role==='admin' || (state.user.role==='accountant' && hasPerm(p))); }
function isViewer(){ return !!(state.user && state.user.role==='viewer'); }
function filterByDate(list, from, to, field){
  if (!from && !to) return list;
  return list.filter(item=>{
    const raw = item[field]; if (!raw) return false;
    const d = new Date(raw);
    if (from && d < new Date(from+'T00:00:00')) return false;
    if (to && d > new Date(to+'T23:59:59')) return false;
    return true;
  });
}
/* Batch membership is many-to-many. students.batch_id remains the legacy PRIMARY
   batch for existing fee calculations and existing Supabase RPC functions. */
function primaryBatchId(s){ return s && s.batch_id || null; }
function memberBatchIds(s){
  if (!s) return [];
  const ids = new Set(primaryBatchId(s) ? [primaryBatchId(s)] : []);
  (state.batchMemberships||[]).forEach(m=>{ if(m.student_id===s.id) ids.add(m.batch_id); });
  return [...ids];
}
function isMemberOfBatch(s, batchId){ return !!(s && batchId && memberBatchIds(s).includes(batchId)); }
function userBatchIds(){
  if(!state.user) return [];

  return [...new Set((state.staffBatchAccess||[]).filter(a=>a.user_id===state.user.id).map(a=>a.batch_id))];

function availableBatches(){

  return !state.selectedBatchId || memberships.includes(state.selectedBatchId);

function computeStats(){
  const batchStudents = visibleStudents();
  const totalStudents = batchStudents.length;
  const totalDue = batchStudents.reduce((sum,s)=>sum+Math.max(0,(s.fee_total||0)-(s.fee_paid||0)),0);
  const visibleIds=new Set(batchStudents.map(s=>s.id));
  const totalDiscounts=(state._discountsByStudent||[]).filter(p=>visibleIds.has(p.student_id)).reduce((n,p)=>n+(Number(p.amount)||0),0);
  const totalCollected = Math.max(0, batchStudents.reduce((sum,s)=>sum+(s.fee_paid||0),0) - totalDiscounts);
  const totalAccountants = state.accounts.filter(a=>a.role==='accountant').length;
  const totalOut = new Set(filteredVisibleLeaves().filter(l=>l.status==='out' && !l.is_permanent).map(l=>l.student_id)).size;
  const fullyPaid = batchStudents.filter(s=>(s.fee_total||0)<=(s.fee_paid||0)).length;
  const male = batchStudents.filter(s=>s.gender==='male').length;
  const female = batchStudents.filter(s=>s.gender==='female').length;
  return { totalStudents, totalDue, totalCollected, totalDiscounts, totalAccountants, totalOut, fullyPaid, male, female, present: totalStudents-totalOut };
}
function sortStudentsList(list){
  const arr = [...list];
  if (state.sortBy==='name') arr.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if (state.sortBy==='roll') arr.sort((a,b)=>(a.roll_no||'').localeCompare(b.roll_no||''));
  else if (state.sortBy==='room') arr.sort((a,b)=>(a.room||'').localeCompare(b.room||''));
  else if (state.sortBy==='due_desc') arr.sort((a,b)=>(((b.fee_total||0)-(b.fee_paid||0))-((a.fee_total||0)-(a.fee_paid||0))));
  else if (state.sortBy==='newest') arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  return arr;
}
function filteredStudents(){
  const q = (state.search||'').trim().toLowerCase();
  let list = visibleStudents();
  if (q) list = list.filter(s => (s.roll_no||'').toLowerCase().includes(q) || (s.name||'').toLowerCase().includes(q) || (s.room||'').toLowerCase().includes(q));
  if (state.duesFilter==='due') list = list.filter(s=>(s.fee_total||0)>(s.fee_paid||0));
  else if (state.duesFilter==='paid') list = list.filter(s=>(s.fee_total||0)<=(s.fee_paid||0));
  if(state.studentAssignmentId && state.studentAssignmentReceipt!=='any'){
    const matched=new Set((state._studentAssignmentRecords||[]).filter(r=>r.assignment_id===state.studentAssignmentId).map(r=>r.student_id));
    list=list.filter(st=>state.studentAssignmentReceipt==='received'?matched.has(st.id):state._studentAssignmentRecords!==null&&!matched.has(st.id));
  }
  if(state.roomFilter) list=list.filter(st=>String(st.room||'').trim()===state.roomFilter);
  if(state.statusFilter==='out')list=list.filter(st=>state.leaves.some(l=>l.student_id===st.id&&l.status==='out'&&!l.is_permanent));
  if(state.statusFilter==='permitted')list=list.filter(st=>state.leaves.some(l=>l.student_id===st.id&&l.status==='approved'));
  if(state.statusFilter==='multibatch')list=list.filter(st=>memberBatchIds(st).length>1);
  if(state.statusFilter==='permanent')list=list.filter(st=>String(st.archived_reason||'').toLowerCase().includes('permanent')||state.leaves.some(l=>l.student_id===st.id&&l.is_permanent&&l.status==='out'));
  if (state.regFrom || state.regTo) list = filterByDate(list, state.regFrom, state.regTo, 'created_at');
  return sortStudentsList(list);
}

let cachedLogoImg = null;
function renderQRInto(elementId, text){
  const el = document.getElementById(elementId); if (!el || typeof QRCode==='undefined') return;
  el.innerHTML=''; new QRCode(el, { text, width:150, height:150, correctLevel: QRCode.CorrectLevel.H });
  drawLogoOnQR(el);
}
function drawLogoOnQR(el){
  if (!cachedLogoImg) return;
  const canvas = el.querySelector('canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const logoSize = size * 0.22; // kept small and centered — well within the High error-correction level's recovery margin, so the code still scans reliably
  const x = (size-logoSize)/2, y = (size-logoSize)/2;
  const pad = logoSize*0.12;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x-pad, y-pad, logoSize+pad*2, logoSize+pad*2);
  ctx.drawImage(cachedLogoImg, x, y, logoSize, logoSize);
}
function preloadLogoImage(dataUrl){
  return new Promise((resolve)=>{
    if (!dataUrl){ cachedLogoImg=null; resolve(); return; }
    const img = new Image();
    img.onload = ()=>{ cachedLogoImg = img; resolve(); };
    img.onerror = ()=>{ cachedLogoImg = null; resolve(); };
    img.src = dataUrl;
  });
}

/* ============================================================
   RENDER + UPDATE (+ centralized post-render side effects —
   this is what fixes QR codes / photos disappearing after a
   re-render triggered by an async data load)

function render(){
  const app = document.getElementById('app'); if (!app) return;
  if (state.view==='loading') app.innerHTML = renderLoading();
  else if (state.view==='setup') app.innerHTML = renderSetup();
  else if (state.view==='login') app.innerHTML = renderLogin();
  else if (state.view==='waiting-approval') app.innerHTML = renderWaitingApproval();
  else if (state.view==='app'){
    if (state.user.role==='admin') app.innerHTML = renderAdminShell();
    else if (state.user.role==='gatekeeper') app.innerHTML = renderGateShell();
    else if (state.user.role==='viewer') app.innerHTML = renderViewerShell();
    else app.innerHTML = renderAccountantShell();
  }
}
function update(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==='number' ? active.selectionEnd : null;
  render();
  syncQuickScan();
  if (activeId){ const el=document.getElementById(activeId); if (el){ el.focus(); if (selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd); }catch(e){} } } }
  runPostRenderEffects();
}
const photoUrlCache = {}; // photo_path -> { url, expiresAt }
const photoFetchInFlight = {}; // photo_path -> Promise, to avoid duplicate concurrent fetches for the same photo
const printablePhotoCache = {}; // photo_path -> embedded data URL for reliable printing
async function getCachedPhotoUrl(photoPath){
  if (!photoPath) return null;
  const cached = photoUrlCache[photoPath];
  if (cached && cached.expiresAt > Date.now()) return cached.url;
  if (photoFetchInFlight[photoPath]) return photoFetchInFlight[photoPath];
  const p = sbSignedUrl('student-photos', photoPath, 300).then(url=>{ // five-minute signed URL
    delete photoFetchInFlight[photoPath];
    if (url) photoUrlCache[photoPath] = { url, expiresAt: Date.now() + 270*1000 };
    return url;
  }).catch(()=>{ delete photoFetchInFlight[photoPath]; return null; });
  photoFetchInFlight[photoPath] = p;
  return p;
}
async function getPrintablePhotoDataUrl(student){
  if (!student || !student.photo_path) return null;
  const path = student.photo_path;
  if (printablePhotoCache[path]) return printablePhotoCache[path];
  try{
    const file = await sbDownloadFile('student-photos', path);
    const dataUrl = await new Promise((resolve)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result||null);
      reader.onerror = ()=>resolve(null);
      reader.readAsDataURL(file);
    });
    if (dataUrl) printablePhotoCache[path] = dataUrl;
    return dataUrl;
  }catch(e){
    try{ const url = await getCachedPhotoUrl(path); return url || null; }catch(err){ return null; }
  }
}
function applyPhoto(elementId, student, cacheHolder){
  const holder = document.getElementById(elementId);
  if (!holder || !student || !student.photo_path) return;
  const cached = photoUrlCache[student.photo_path];
  if (cached && cached.expiresAt > Date.now()){ holder.innerHTML = `<img src="${esc(cached.url)}" alt="${esc(student.name||'')}" />`; return; }
  getCachedPhotoUrl(student.photo_path).then(url=>{
    if (!url) return;
    const h = document.getElementById(elementId);
    if (h) h.innerHTML = `<img src="${esc(url)}" alt="${esc(student.name||'')}" />`;
  });
}
function runPostRenderEffects(){
  if (state.modal && state.modal.type==='profile'){
    renderQRInto('qr-canvas-holder', state.modal.student.roll_no);
    applyPhoto('profile-photo-holder', state.modal.student, state.modal);
  }
  if (state.gateResult && state.gateResult.found){
    applyPhoto('gate-photo-holder', state.gateResult.student, state.gateResult);
  }
  // Photos are intentionally lazy-loaded only for an individually opened student profile or gate verification.
}
let toastHideTimer = null;
function toast(message, kind){
  if (message === '__session_expired__') return; // already handled with a clean redirect + its own message — avoid a redundant/confusing second popup
  if (!state.user && state.view !== 'app') return; // avoid showing a stale background request's error after the person has already been logged out
  kind = kind || 'success';
  const container = document.getElementById('toast-container');
  if (!container) return;
  container.innerHTML = `<div class="toast toast-${kind}">${esc(message)}</div>`;
  if (toastHideTimer) clearTimeout(toastHideTimer);
  toastHideTimer = setTimeout(()=>{ container.innerHTML = ''; }, 3200);
}
function renderToast(){ return ''; } // toasts now render via a persistent container outside #app — see toast()

async function attemptLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password){ state.loginError='Enter both email and password.'; update(); return; }
  const btn = document.getElementById('login-submit-btn'); if (btn){ btn.disabled=true; btn.textContent='Signing in…'; }
  try{
    const data = await sbSignIn(email, password);
    session = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now()+data.expires_in*1000, user:data.user };
    await persistSession();
    await loadMyProfile();
    state.loginError = null;
    if (state.user.role === 'admin'){
      state.view='app'; state.adminTab='dashboard'; state.accTab='scan'; state.gateTab='gate'; state.viewerTab='dashboard';
      await loadAllForRole();
      update();
      startInactivityWatch();
      startDeviceHeartbeat();
    } else {
      const already = await sbSelect('login_requests', `?user_id=eq.${state.user.id}&device_id=eq.${DEVICE_ID}&status=eq.approved&select=id&limit=1`).catch(()=>[]);
      if (already && already.length){
        // This exact device was already approved before — skip straight in, no waiting.
        state.view='app'; state.adminTab='dashboard'; state.accTab='scan'; state.gateTab='gate'; state.viewerTab='dashboard';
        await loadAllForRole();
        update();
        startInactivityWatch();
        startDeviceHeartbeat();
      } else {
        await requestLoginApproval();
        state.view='waiting-approval';
        update();
        startApprovalPolling();
      }
    }
  }catch(e){
    await clearSession();
    purgeLocalStudentData();state.user=null;state.view='login';
    state.loginError = e.message==='inactive' ? 'Your account has been disabled. Contact your administrator.' : (e.message||'Login failed.');
    update();
  }
}
async function requestLoginApproval(){
  const device = (navigator.userAgent||'unknown device').slice(0,180);
  const inserted = await sbInsert('login_requests', { user_id: state.user.id, email: state.user.email, device_info: device, status:'pending', device_id: DEVICE_ID });
  state.myLoginRequestId = inserted[0].id;
}
function startApprovalPolling(){
  if (approvalPollInterval) clearInterval(approvalPollInterval);
  approvalPollInterval = setInterval(async ()=>{
    try{
      const rows = await sbSelect('login_requests', `?id=eq.${state.myLoginRequestId}&select=status`);
      const status = rows && rows[0] && rows[0].status;

/* ============================================================
   INACTIVITY AUTO-LOGOUT
   Security measure for shared/front-desk devices: signs the person
   out after a period with no real interaction (clicks, taps, key
   presses). A warning toast appears shortly before it happens so
   an actively-reading-but-not-clicking person has a chance to
   notice. Scanning/typing counts as activity via the same listeners.
   ============================================================ */
const INACTIVITY_LIMIT_MS = 60 * 60 * 1000; // 60 minutes for shared devices
const INACTIVITY_WARNING_MS = 5 * 60 * 1000; // warn 5 minutes before
let lastActivityAt = Date.now();
let inactivityInterval = null;
let inactivityWarned = false;
function markActivity(){ lastActivityAt = Date.now(); inactivityWarned = false; }
let heartbeatInterval = null;
function startDeviceHeartbeat(){
  if (heartbeatInterval || !state.user || state.user.role==='admin') return; // admin never goes through device approval, nothing to track
  const ping = async ()=>{
    try{
      const status = await sbRpc('touch_device_heartbeat', {});
      if (status === 'denied'){
        clearInterval(heartbeatInterval); heartbeatInterval = null;
        toast('Access for this device was revoked by an admin.','error');
        logout();
      } else if (!status){
        // No device-specific approval on record at all for this session — most likely this
        // account's old approval predates device-tracking. Sign out cleanly so the normal
        // login flow can request fresh approval for this device, rather than leaving the
        // person looking at silently broken/empty screens for the rest of the session.
        clearInterval(heartbeatInterval); heartbeatInterval = null;
        toast('Please log in again to approve this device.','error');
        logout();
      }
    }catch(e){}
  };
  ping();
  heartbeatInterval = setInterval(ping, 3*60*1000);
}
function stopDeviceHeartbeat(){ if (heartbeatInterval){ clearInterval(heartbeatInterval); heartbeatInterval=null; } }
function friendlyDeviceLabel(ua){
  if (!ua) return 'Unknown device';
  const isTablet = /iPad|Tablet/i.test(ua);
  let os = 'Unknown OS';
  if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone/i.test(ua)) os = 'iPhone';
  else if (/iPad/i.test(ua)) os = 'iPad';
  else if (/Windows/i.test(ua)) os = 'Windows';
  else if (/Mac OS X/i.test(ua)) os = 'Mac';
  else if (/Linux/i.test(ua)) os = 'Linux';
  let browser = '';
  if (/Edg\//i.test(ua)) browser = 'Edge';
  else if (/Chrome\//i.test(ua)) browser = 'Chrome';
  else if (/CriOS/i.test(ua)) browser = 'Chrome';
  else if (/Firefox\//i.test(ua)) browser = 'Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
  return browser ? `${os} · ${browser}${isTablet?' (tablet)':''}` : os;
}
function startInactivityWatch(){
  if (inactivityInterval) return;
  lastActivityAt = Date.now(); inactivityWarned = false;
  ['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, markActivity, true));
  inactivityInterval = setInterval(()=>{
    if (!state.user) return;
    const idleFor = Date.now() - lastActivityAt;
    if (idleFor > INACTIVITY_LIMIT_MS){
      toast('Logged out after 60 minutes of inactivity, for security.','error');
      logout();
    } else if (!inactivityWarned && idleFor > INACTIVITY_LIMIT_MS - INACTIVITY_WARNING_MS){
      inactivityWarned = true;
      toast('You will be logged out soon due to inactivity — tap anywhere to stay signed in.','error');
    }
  }, 5*60*1000);
}
function stopInactivityWatch(){
  if (inactivityInterval){ clearInterval(inactivityInterval); inactivityInterval=null; }
  ['click','keydown','touchstart'].forEach(evt => document.removeEventListener(evt, markActivity, true));
}

async function refreshOneStudent(rollNo){
  // Patches just the one changed row into state.students in place, instead of
  // re-fetching the entire table (every column, every student, no limit) —
  // that full-table pattern is what was driving egress usage far out of
  // proportion to the actual database size.
  if (!rollNo) return;
  try{
    const rows = await sbSelect('students', `?roll_no=eq.${encodeURIComponent(rollNo)}&select=*&limit=1`);
    const fresh = rows && rows[0];
    if (!fresh || !canViewStudent(fresh)) return; // do not add unseen students through scan lookups
    const idx = state.students.findIndex(s=>s.id===fresh.id);
    if (idx!==-1) state.students[idx] = fresh; else state.students.unshift(fresh);
  }catch(e){ /* non-fatal — the on-screen data just stays one action stale until the next full load */ }
}

async function saveStudentMemberships(studentId, selectedIds, originalPrimary){
  const target=new Set(selectedIds||[]);
  if(originalPrimary) target.add(originalPrimary);
  const existing=new Set((state.batchMemberships||[]).filter(m=>m.student_id===studentId).map(m=>m.batch_id));
  for(const id of target){ if(!existing.has(id)) await sbUpsert('student_batches', {student_id:studentId,batch_id:id}, 'student_id,batch_id'); }

  await loadStudentBatchMemberships();

function groupStudentsByRoom(arr){
  const withRoom = {}; const withoutRoom = [];
  arr.forEach(s=>{
    const r = (s.room||'').trim();
    if (!r){ withoutRoom.push(s); return; }
    if (!withRoom[r]) withRoom[r] = [];
    withRoom[r].push(s);
  });
  const roomKeys = Object.keys(withRoom).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
  return { roomKeys, withRoom, withoutRoom };
}
function renderGenderSection(title, arr){
  if (!arr.length) return '';
  const { roomKeys, withRoom, withoutRoom } = groupStudentsByRoom(arr);
  return `<div class="gender-section">
    <h3 class="gender-section-title">${esc(title)} (${arr.length})</h3>
    ${roomKeys.map(r=>`<div class="room-group">
      <div class="room-group-title">Room ${esc(r)}</div>
      <div class="student-grid">${withRoom[r].map(renderStudentCard).join('')}</div>
    </div>`).join('')}
    ${withoutRoom.length? `<div class="student-grid">${withoutRoom.map(renderStudentCard).join('')}</div>` : ''}
  </div>`;
}
function renderStudentsGroupedByGenderRoom(list){
  const male = list.filter(s=>s.gender==='male');
  const female = list.filter(s=>s.gender==='female');
  const other = list.filter(s=>s.gender!=='male' && s.gender!=='female');
  const html = renderGenderSection('Male', male) + renderGenderSection('Female', female) + renderGenderSection('Not specified', other);
  return html || `<div class="card"><p class="empty-hint">No students match.</p></div>`;
}

function editBatch(id){ state.modal.editBatchId=id||null; update(); }
async function saveBatch(){
  const name=document.getElementById('batch-name').value.trim();
  const short_code=document.getElementById('batch-shortcode').value.trim()||null;
  const monthly_fee_amount=Number(document.getElementById('batch-monthly').value||0);
  const onetime_fee_amount=Number(document.getElementById('batch-onetime').value||0);
  const starts_on=document.getElementById('batch-start').value||null;
  const ends_on=document.getElementById('batch-end').value||null;
  const description=document.getElementById('batch-description').value.trim();
  const is_active=document.getElementById('batch-active').value==='true';
  if(state.modal?.editBatchId && state.batches.find(b=>b.id===state.modal.editBatchId)?.is_archived){toast('Restore this batch before editing.','error');return;}
  if(!name||!Number.isFinite(monthly_fee_amount)||monthly_fee_amount<0||!Number.isFinite(onetime_fee_amount)||onetime_fee_amount<0){toast('Enter a valid name and non-negative fee amounts.','error');return;}
  if(starts_on&&ends_on&&starts_on>ends_on){toast('End date cannot be earlier than start date.','error');return;}
  const btn=document.getElementById('batch-save-btn');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  const details={name,short_code,monthly_fee_amount,onetime_fee_amount,starts_on,ends_on,description,is_active};
  try{
    if(state.modal.editBatchId) await sbUpdate('batches',`?id=eq.${encodeURIComponent(state.modal.editBatchId)}`,details);
    else await sbInsert('batches',details);
    state.modal.editBatchId=null;
    await loadBatches();chooseInitialBatch();update();toast('Batch saved.','success');
  }catch(e){toast(e.message,'error');if(btn){btn.disabled=false;btn.textContent='Save';}}
}

function archiveBatch(id){
  const b=state.batches.find(x=>x.id===id);if(!b||b.is_archived)return;
  const members=state.students.filter(st=>isMemberOfBatch(st,id));
  const crossBatch=members.filter(st=>memberBatchIds(st).length>1).length;
  confirmAction(`Archive batch "${b.name}" and ALL of its enrolled students from the entire hostel? ${members.length} currently active student(s), including ${crossBatch} enrolled in other batches, will move to the student recycle bin. Their payment/attendance history will stay intact. You can restore the batch later.`, async()=>{
    try{
      const result=await sbRpc('vidya_archive_batch',{p_batch_id:id});
      state._allPayments=null;state._myPayments=null;state._attendanceList=null;state._roster=null;
      await Promise.all([loadBatches(),loadStudents(),loadStudentBatchMemberships(),loadLeaves(),loadActivity(),loadMonthlyPaymentStatus()]);
      chooseInitialBatch();state.modal={type:'batches',editBatchId:null,batchArchiveView:true};update();
      toast(`Batch archived. ${Number(result?.newly_archived||0)} student(s) moved to recycle bin.`,'success');
    }catch(e){toast('Could not archive batch: '+e.message,'error');}
  });
}
function restoreBatch(id){
  const b=state.batches.find(x=>x.id===id);if(!b||!b.is_archived)return;
  confirmAction(`Restore batch "${b.name}"? Students archived because of batches will be restored only if no other archived batch still includes them. Independently archived students stay archived.`,async()=>{
    try{
      const result=await sbRpc('vidya_restore_batch',{p_batch_id:id});
      state._allPayments=null;state._myPayments=null;state._attendanceList=null;state._roster=null;
      await Promise.all([loadBatches(),loadStudents(),loadStudentBatchMemberships(),loadLeaves(),loadActivity(),loadMonthlyPaymentStatus()]);
      chooseInitialBatch();state.modal={type:'batches',editBatchId:null,batchArchiveView:false};update();
      toast(`Batch restored. ${Number(result?.restored_students||0)} student(s) restored.`,'success');
    }catch(e){toast('Could not restore batch: '+e.message,'error');}
  });
}
function deleteBatch(id){

    try{ if(state.students.some(st=>isMemberOfBatch(st,id))){toast('Move students out of this batch before deleting it.','error');return;} await sbDelete('batches', `?id=eq.${encodeURIComponent(id)}`); toast('Batch deleted.','success'); await loadBatches(); }

function openBatchAssignModal(batchId){ if(state.user?.role!=='admin'){toast('Only administrators may assign students to batches.','error');return;} state.modal = { type:'batchAssign', batchId, search:'', changes:{} }; update(); }
function batchAssignModalHTML(m){
  const batch=state.batches.find(b=>b.id===m.batchId);

  const list=state.students.filter(s=>!q||s.name.toLowerCase().includes(q)||s.roll_no.toLowerCase().includes(q));
  const chosen=s=>(Object.prototype.hasOwnProperty.call(m.changes,s.id)?m.changes[s.id]:isMemberOfBatch(s,m.batchId));
  const allChecked=list.length>0&&list.every(chosen);

    <h3>Assign students · ${esc(batch?.name||'')}</h3>

    <div class="select-all-row"><label><input type="checkbox" ${allChecked?'checked':''} onchange="toggleBatchAssignAll(this.checked)" /> Select all shown (${list.length})</label><span class="muted">${Object.keys(m.changes).length} pending</span></div>
    <div style="max-height:45vh;overflow:auto;border:1px solid var(--border);border-radius:10px;">
      ${list.map(st=>`<label style="display:flex;gap:10px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border);cursor:pointer;">

      </label>`).join('')||'<p class="empty-hint">No students found.</p>'}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="batch-assign-btn" onclick="submitBatchAssign()">Save assignments</button></div>
  </div></div>`;
}
function onBatchAssignSearch(v){state.modal.search=v;update();}
function toggleBatchAssignStudent(studentId,checked){state.modal.changes[studentId]=checked;}
function toggleBatchAssignAll(checked){
  const m=state.modal,q=(m.search||'').trim().toLowerCase();
  state.students.filter(st=>!q||st.name.toLowerCase().includes(q)||st.roll_no.toLowerCase().includes(q)).forEach(st=>{
    if(primaryBatchId(st)!==m.batchId) m.changes[st.id]=checked;
  });update();
}
async function submitBatchAssign(){
  if(state.user?.role!=='admin'){toast('Batch assignment permission denied.','error');return;}
  const m=state.modal,ids=Object.keys(m.changes);
  if(!ids.length){closeModal();return;}
  const btn=document.getElementById('batch-assign-btn');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  let done=0;
  try{
    for(const id of ids){
      const st=state.students.find(s=>s.id===id);
      if(!st)continue;
      if(m.changes[id]) await sbUpsert('student_batches',{student_id:id,batch_id:m.batchId},'student_id,batch_id');
      else if(primaryBatchId(st)!==m.batchId) await sbDelete('student_batches',`?student_id=eq.${encodeURIComponent(id)}&batch_id=eq.${encodeURIComponent(m.batchId)}`);
      done++;
    }
    await loadStudentBatchMemberships();closeModal();toast(`Updated ${done} membership(s).`,'success');
  }catch(e){toast(`Saved ${done} changes, then stopped: ${e.message}`,'error');if(btn){btn.disabled=false;btn.textContent='Retry remaining';}await loadStudentBatchMemberships();}
}

async function submitStudentForm(){
  if(!state.modal?.originalRollNo && !canDo('add_student')){toast('Student registration permission denied.','error');return;}
  if(state.modal?.originalRollNo && !canDo('edit_student')){toast('Student edit permission denied.','error');return;}
  syncContactsFromDOM();
  const originalRollNo = state.modal && state.modal.originalRollNo;
  const rollNo = document.getElementById('f-rollno').value.trim();
  const name = toTitleCase(document.getElementById('f-name').value.trim());
  const room = document.getElementById('f-room').value.trim();
  const gender = document.getElementById('f-gender').value || null;
  const batchId = document.getElementById('f-batch').value || null;
  if(batchId && state.batches.find(b=>b.id===batchId)?.is_archived){toast('An archived batch cannot receive new students.','error');return;}
  const selectedBatchIds=[...document.querySelectorAll('[data-student-batch]:checked')].map(el=>el.dataset.studentBatch);
  if(batchId&&!selectedBatchIds.includes(batchId))selectedBatchIds.push(batchId);
  if(state.user.role!=='admin' && selectedBatchIds.some(id=>!userBatchIds().includes(id))){toast('You cannot assign a batch outside your staff access.','error');return;}
  const father = toTitleCase(document.getElementById('f-father').value.trim());
  const mother = toTitleCase(document.getElementById('f-mother').value.trim());
  const addrVillage = toTitleCase((document.getElementById('f-addr-village')||{value:''}).value.trim());
  const addrPo = toTitleCase((document.getElementById('f-addr-po')||{value:''}).value.trim());
  const addrPs = toTitleCase((document.getElementById('f-addr-ps')||{value:''}).value.trim());
  const addrDistrict = toTitleCase((document.getElementById('f-addr-district')||{value:''}).value.trim());
  const addrState = toTitleCase((document.getElementById('f-addr-state')||{value:''}).value.trim());
  const addrPin = (document.getElementById('f-addr-pin')||{value:''}).value.trim();
  const feeMode = document.getElementById('f-feemode').value;
  const feeTotal = Math.max(0, parseFloat(document.getElementById('f-feetotal').value) || 0);
  const photoFile = document.getElementById('f-photo').files[0] || null;
  const contacts = (state.modal.contacts||[]).filter(c=>c.phone && c.phone.trim()).map(c=>({ label: toTitleCase((c.label||'').trim()) || 'Contact', phone: c.phone.trim() }));
  if(!rollNo || !name){ toast('Roll number and name are required.','error'); return; }
  if(state.user.role!=='admin' && (!batchId || (batchId!==state.modal.existing?.batch_id && !userBatchIds().includes(batchId)))){toast('Choose a primary batch you have access to.','error');return;}

  let cashPaid=0, onlinePaid=0, initUid='', initBank='';
  if (!originalRollNo && canDo('record_payment')){
    cashPaid = Math.max(0, parseFloat((document.getElementById('f-cash-paid')||{value:'0'}).value) || 0);
    onlinePaid = Math.max(0, parseFloat((document.getElementById('f-online-paid')||{value:'0'}).value) || 0);
    initUid = (document.getElementById('f-payuid')||{value:''}).value.trim();
    initBank = (document.getElementById('f-paybank')||{value:''}).value.trim();
    if (onlinePaid>0 && (!initUid || !initBank)){ toast('Enter the transaction UID and bank for the online portion.','error'); return; }
  }
  const payload = { name, room, gender, batch_id:batchId, father_name:father, mother_name:mother,
    addr_village_town:addrVillage, addr_po:addrPo, addr_ps:addrPs, addr_district:addrDistrict, addr_state:addrState, addr_pin:addrPin,
    contacts, fee_mode:feeMode, fee_total:feeTotal };
  const args = { rollNo, name, payload, originalRollNo, photoFile, cashPaid, onlinePaid, initUid, initBank, selectedBatchIds };

  // Hard block: roll number already belongs to someone else — checked via RPC so this
  // works correctly even for accountants without recycle-bin viewing permission (a direct
  // table query would silently miss archived duplicates for them, per the RLS split).
  if (!originalRollNo){
    try{
      const rows = await sbRpc('check_roll_no_available', { p_roll_no: rollNo });
      const result = rows && rows[0];
      if (result && result.is_taken){
        toast(result.is_archived ? `Roll number "${rollNo}" belongs to an archived student (${result.student_name}) — restore them from the recycle bin, or use a different roll number.` : `Roll number "${rollNo}" is already in use by an existing student.`, 'error');
        return;
      }
    }catch(e){ /* if the check itself fails, fall through — the insert will still safely reject a true duplicate */ }
  }
  // Soft check: same name exists elsewhere — could be the same person re-entered, or just a coincidence
  const nameDup = state.students.find(s => s.name.trim().toLowerCase()===name.toLowerCase() && s.roll_no.toLowerCase()!==(originalRollNo||'').toLowerCase());
  if (nameDup){
    confirmAction(`A student named "${name}" already exists — roll ${nameDup.roll_no}, room ${nameDup.room||'—'}. Continue adding this as a separate student?`, ()=> actuallySubmitStudent(args));
    return;
  }
  const phoneNumbers=new Set(contacts.map(c=>String(c.phone||'').replace(/\D/g,'')).filter(x=>x.length>=7));
  const phoneDup=state.students.find(st=>st.roll_no.toLowerCase()!==(originalRollNo||'').toLowerCase() && parseContacts(st.contacts).some(c=>phoneNumbers.has(String(c.phone||'').replace(/\D/g,''))));
  if(phoneDup){
    confirmAction(`A contact number is already used for ${phoneDup.name} (${phoneDup.roll_no}). Save this student anyway?`,()=>actuallySubmitStudent(args));return;
  }
  await actuallySubmitStudent(args);
}
async function actuallySubmitStudent({ rollNo, name, payload, originalRollNo, photoFile, cashPaid, onlinePaid, initUid, initBank, selectedBatchIds=[] }){
  if(originalRollNo && !canDo('edit_student')){toast('Student edit permission denied.','error');return;}
  if(!originalRollNo && !canDo('add_student')){toast('Student registration permission denied.','error');return;}
  const btn = document.getElementById('student-save-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  let savedStudent=false;
  const warnings=[];
  try{
    let row;
    if(!originalRollNo){
      payload.fee_paid=0;
      const inserted=await sbInsert('students',Object.assign({roll_no:rollNo},payload));
      row=inserted&&inserted[0];
      if(!row?.id)throw new Error('Student registration returned no record. Check SELECT/INSERT permissions.');
      savedStudent=true;
    }else{
      row=state.students.find(s=>s.roll_no.toLowerCase()===originalRollNo.toLowerCase());
      if(!row)throw new Error('Student not found in current batch.');
      await sbUpdate('students',`?id=eq.${encodeURIComponent(row.id)}`,Object.assign({},payload));
      savedStudent=true;
    }
    // Student INSERT/UPDATE is complete here. Never imply the record failed to save
    // if a separate optional photo, membership, payment or audit request fails.
    try{await saveStudentMemberships(row.id,selectedBatchIds,payload.batch_id);}
    catch(e){warnings.push('Batch memberships: '+e.message);}
    if(photoFile){
      try{
        const path=await uploadStudentPhoto(row.id,photoFile);
        await sbUpdate('students',`?id=eq.${encodeURIComponent(row.id)}`,{photo_path:path});
        delete photoUrlCache[path];
      }catch(e){warnings.push('Photo: '+e.message);}
    }
    if(!originalRollNo && (cashPaid>0||onlinePaid>0)){
      try{
        if(!canDo('record_payment'))throw new Error('Payment permission is not enabled.');
        await sbRpc('record_split_payment',{p_roll_no:rollNo,p_cash_amount:cashPaid,p_online_amount:onlinePaid,p_uid:initUid,p_bank:initBank});
      }catch(e){warnings.push('Initial payment NOT recorded: '+e.message);}
    }
    try{
      await sbInsert('activity_log',{type:originalRollNo?'student_edit':'student_add',roll_no:rollNo,details:`${name} (${rollNo})`,by_name:state.user.name});
    }catch(e){warnings.push('Audit entry: '+e.message);}
    const refresh=await Promise.allSettled([refreshOneStudent(rollNo),loadActivity(),refreshFinancialSummaries()]);
    refresh.forEach((r,i)=>{if(r.status==='rejected')warnings.push(['Student refresh','Activity refresh','Financial refresh'][i]+': '+r.reason?.message);});
    if(originalRollNo){closeModal();}
    else{
      const nextPreferredBatchId=payload.batch_id||state.selectedBatchId||'';
      state.modal={type:'studentForm',existing:null,originalRollNo:null,preferredBatchId:nextPreferredBatchId,
        contacts:[{label:'Student',phone:''},{label:'Guardian',phone:''}]};
      update();
      const rollInput=document.getElementById('f-rollno');if(rollInput)rollInput.focus();
    }
    if(warnings.length){
      toast(`${name} SAVED (roll ${rollNo}); additional operations need attention: ${warnings.join('; ')}. Do not add the same roll again.`,'error');
    }else toast(originalRollNo?'Student updated successfully.':`${name} registered successfully.`,'success');
  }catch(e){
    toast(savedStudent?`Student ${rollNo} was saved, but a later step failed: ${e.message}. Check the record before retrying.`:e.message,'error');
    if(btn?.isConnected){btn.disabled=false;btn.textContent=originalRollNo?'Save changes':'Add student';}
  }
}
/* Privacy/bandwidth: photos are resized, stripped of metadata and aggressively compressed
   BEFORE upload. Never convert uploaded images into frontend base64 storage. */
function resizeImageForUpload(file){
  return new Promise((resolve,reject)=>{
    if(!file || !String(file.type||'').startsWith('image/')) return reject(new Error('Choose an image file.'));
    if(file.size>15*1024*1024) return reject(new Error('Photo must be under 15 MB.'));
    const objectUrl=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const maxDim=500,scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        let quality=.76;
        const attempt=()=>canvas.toBlob(blob=>{
          if(!blob) return reject(new Error('Photo compression failed.'));
          if(blob.size>125*1024 && quality>.3){ quality-=.12;attempt(); }
          else resolve(blob);
        },'image/jpeg',quality);
        attempt();
      }catch(e){reject(e);}finally{URL.revokeObjectURL(objectUrl);}
    };
    img.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error('Photo could not be decoded.'));};
    img.src=objectUrl;
  });
}
async function uploadStudentPhoto(studentId, file){
  const resized = await resizeImageForUpload(file);
  return await sbUploadFile('student-photos', `${studentId}.jpg`, resized);
}
const PHOTO_ALREADY_SMALL_BYTES = 150*1024; // skip re-processing photos already under ~150KB
async function runBulkPhotoCompression(){
  let rows;
  try{ rows = await sbSelect('students', '?select=id,roll_no,photo_path&photo_path=not.is.null'); }
  catch(e){ toast('Could not load the student photo list: '+e.message,'error'); return; }
  if (!rows.length){ toast('No students have a photo on file.','success'); return; }

  state._photoCompressProgress = { done:0, total:rows.length, compressed:0, skipped:0, failed:0, savedMB:0, running:true };
  update();

  let savedBytes = 0;
  for (const s of rows){
    try{
      const original = await sbDownloadFile('student-photos', s.photo_path);
      if (original.size <= PHOTO_ALREADY_SMALL_BYTES){
        state._photoCompressProgress.skipped++;
      } else {
        const compressed = await resizeImageForUpload(original);
        const newPath = `${s.id}.jpg`;
        await sbUploadFile('student-photos', newPath, compressed);
        if (newPath !== s.photo_path){
          await sbUpdate('students', `?id=eq.${s.id}`, { photo_path:newPath });
          await sbDeleteFile('student-photos', s.photo_path); // best-effort cleanup of the old-format original
        }
        savedBytes += Math.max(0, original.size - compressed.size);
        state._photoCompressProgress.compressed++;
        state._photoCompressProgress.savedMB = Math.round(savedBytes/1024/1024*10)/10;
        delete photoUrlCache[s.photo_path]; delete photoUrlCache[newPath]; // don't keep serving a stale cached link to the file we just replaced
      }
    }catch(e){ state._photoCompressProgress.failed++; }
    state._photoCompressProgress.done++;
    update();
  }
  state._photoCompressProgress.running = false;
  toast('Photo compression complete.','success');
  update();
}

function studentIDValidTill(s){
  // The database currently has batch.ends_on, not a separate student ID expiry field.
  // Latest known end date across enrolled batches avoids prematurely expiring multibatch cards.

    .filter(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const date=ends[ends.length-1];
  if(!date)return '—'; // Never invent an expiry date.
  const [yyyy,mm,dd]=date.split('-');
  return `${dd}/${mm}/${yyyy}`;

const CSV_COLUMN_ALIASES = {
  rollno: ['rollno','roll','rollnumber'],
  name: ['name','studentname','fullname'],
  room: ['room','roomno','roomnumber'],
  gender: ['gender','sex'],
  batch: ['batch','batchcode','batchname'],
  fathername: ['fathername','fathersname','father'],
  mothername: ['mothername','mothersname','mother'],
  villagetown: ['villagetown','village','town','villagetownname'],
  po: ['po','postoffice'],
  ps: ['ps','policestation','thana'],
  district: ['district'],
  state: ['state'],
  pin: ['pin','pincode','postalcode','zip'],
  address: ['address'],
  contacts: ['contacts','contact','phone','phonenumber','phonenumbers'],
  feemode: ['feemode','mode'],
  feetotal: ['feetotal','totalfee','fee','amount'],
  cashpaid: ['cashpaid','cash','feepaid','paid','amountpaid'],
  onlinepaid: ['onlinepaid','online'],
  onlineuid: ['onlineuid','uid','utr','transactionid'],
  onlinebank: ['onlinebank','bank'],
  extrabatches: ['extrabatches','additionalbatches','otherbatches']
};
const CSV_DEFAULT_ORDER = ['rollno','name','room','gender','batch','fathername','mothername','villagetown','po','ps','district','state','pin','contacts','feemode','feetotal','cashpaid','onlinepaid','onlineuid','onlinebank','extrabatches'];
function normalizeHeaderToken(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z]/g,''); }
function parseCsvRows(raw){
  const rows=[];let row=[],cell='',inside=false;
  const data=String(raw||'').replace(/^\uFEFF/,'');
  for(let i=0;i<data.length;i++){
    const ch=data[i];
    if(ch==='"'){
      if(inside && data[i+1]==='"'){cell+='"';i++;}else inside=!inside;
    }else if(ch===','&&!inside){row.push(cell.trim());cell='';}
    else if((ch==='\n'||ch==='\r')&&!inside){
      if(ch==='\r'&&data[i+1]==='\n')i++;
      row.push(cell.trim());rows.push(row);row=[];cell='';
    }else cell+=ch;
  }
  if(inside)throw new Error('CSV has an unclosed quoted value.');
  row.push(cell.trim());if(row.some(c=>c))rows.push(row);
  return rows;
}
async function parseAndImportCSV(){
  const raw = document.getElementById('csv-textarea').value;
  let lines;try{lines=parseCsvRows(raw).filter(row=>row.some(v=>v.trim().length));}catch(e){toast(e.message,'error');return;}
  if (!lines.length){ toast('Paste or upload some CSV data first.','error'); return; }
  const btn = document.getElementById('import-btn'); if (btn){ btn.disabled=true; btn.textContent='Importing…'; }

  const firstRowTokens = lines[0].map(normalizeHeaderToken);
  const looksLikeHeader = firstRowTokens.some(t=>CSV_COLUMN_ALIASES.rollno.includes(t)) && firstRowTokens.some(t=>CSV_COLUMN_ALIASES.name.includes(t));
  const dataLines = looksLikeHeader ? lines.slice(1) : lines;

  function colIndex(key){
    if (looksLikeHeader){
      const aliases = CSV_COLUMN_ALIASES[key] || [key];
      for (const a of aliases){ const idx = firstRowTokens.indexOf(a); if (idx!==-1) return idx; }
      return -1;
    }
    return CSV_DEFAULT_ORDER.indexOf(key);
  }
  const idx = {}; CSV_DEFAULT_ORDER.forEach(k=>{ idx[k]=colIndex(k); });
  function getVal(parts, key){ const i=idx[key]; return (i===-1 || i==null) ? '' : (parts[i]||'').trim(); }

  let added=0, skipped=0, batchMisses=0, nameDupes=0, sharedContacts=0;
  let allExisting;
  try{ allExisting = await sbSelectAll('students', '?select=roll_no,name,contacts'); }catch(e){ allExisting = state.students; }
  const existingRolls = new Set(allExisting.map(s=>s.roll_no.toLowerCase()));
  const existingNames = new Set(allExisting.map(s=>s.name.trim().toLowerCase()));
  const knownPhones=new Set(allExisting.flatMap(st=>parseContacts(st.contacts).map(c=>String(c.phone||'').replace(/\D/g,''))).filter(n=>n.length>=7));
  const rowsToInsert = [];
  const initialPayments = []; // {rollNo, amount}
  const extraByRoll = new Map();
  dataLines.forEach((parts)=>{
    const rollNo = getVal(parts,'rollno');
    const name = toTitleCase(getVal(parts,'name'));
    if (!rollNo || !name || existingRolls.has(rollNo.toLowerCase())){ skipped++; return; }
    if (existingNames.has(name.toLowerCase())) nameDupes++;
    const room = getVal(parts,'room');
    const gender = getVal(parts,'gender').toLowerCase();
    const batchText = getVal(parts,'batch');
    const batch = findBatchByCodeOrName(batchText);
    if (batchText && !batch) batchMisses++;
    const extraIds=new Set();
    getVal(parts,'extrabatches').split('|').map(x=>x.trim()).filter(Boolean).forEach(text=>{
      const extra=findBatchByCodeOrName(text);
      if(extra)extraIds.add(extra.id);else batchMisses++;
    });
    if(batch)extraIds.add(batch.id);
    extraByRoll.set(rollNo.toLowerCase(),[...extraIds]);
    const importedContacts=parseContactsField(getVal(parts,'contacts'));
    if(importedContacts.some(c=>knownPhones.has(String(c.phone).replace(/\D/g,''))))sharedContacts++;
    importedContacts.forEach(c=>{const n=String(c.phone).replace(/\D/g,'');if(n.length>=7)knownPhones.add(n);});
    const cashAmt = Math.max(0,parseFloat(getVal(parts,'cashpaid'))||0);
    const onlineAmt = Math.max(0,parseFloat(getVal(parts,'onlinepaid'))||0);
    if (cashAmt>0||onlineAmt>0) initialPayments.push({ rollNo, cashAmt, onlineAmt, uid:getVal(parts,'onlineuid'), bank:getVal(parts,'onlinebank') });
    rowsToInsert.push({ roll_no:rollNo, name, room,
      gender: ['male','female','other'].includes(gender) ? gender : null,
      batch_id: batch?batch.id:null,
      father_name:toTitleCase(getVal(parts,'fathername')), mother_name:toTitleCase(getVal(parts,'mothername')),
      addr_village_town:toTitleCase(getVal(parts,'villagetown')), addr_po:toTitleCase(getVal(parts,'po')),
      addr_ps:toTitleCase(getVal(parts,'ps')), addr_district:toTitleCase(getVal(parts,'district')), addr_state:toTitleCase(getVal(parts,'state')), addr_pin:getVal(parts,'pin'),
      contacts: importedContacts,
      fee_mode: (getVal(parts,'feemode').toLowerCase()==='monthly'?'monthly':'onetime'),
      fee_total:parseFloat(getVal(parts,'feetotal'))||0, fee_paid:0 });
    existingRolls.add(rollNo.toLowerCase());
    existingNames.add(name.toLowerCase());
    added++;
  });
  try{
    const insertedRows=[];
    for(let i=0;i<rowsToInsert.length;i+=250){
      const chunk=await sbInsert('students',rowsToInsert.slice(i,i+250));
      insertedRows.push(...(chunk||[]));
    }
    const extraLinks=[];
    (insertedRows||[]).forEach(r=>{
      const ids=extraByRoll.get(String(r.roll_no).toLowerCase())||[];
      ids.forEach(batchId=>extraLinks.push({student_id:r.id,batch_id:batchId}));
    });
    if(extraLinks.length)await sbUpsert('student_batches',extraLinks,'student_id,batch_id');
    let failedPayments=0;
    if (initialPayments.length){
      toast(`Adding ${added} student(s) — recording ${initialPayments.length} initial payment(s)…`,'success');
      for (let i=0; i<initialPayments.length; i+=10){
        const chunk = initialPayments.slice(i, i+10);
        await Promise.all(chunk.map(p => sbRpc('record_split_payment', { p_roll_no:p.rollNo, p_cash_amount:p.cashAmt||0, p_online_amount:p.onlineAmt||0, p_uid:p.uid||'', p_bank:p.bank||'' }).catch(()=>{failedPayments++;})));
      }
    }
    await sbInsert('activity_log', { type:'student_add', details:`Bulk import: ${added} added, ${skipped} skipped${batchMisses?`, ${batchMisses} batch reference(s) not found`:''}${nameDupes?`, ${nameDupes} names repeated`:''}${sharedContacts?`, ${sharedContacts} shared contacts`:''}`, by_name: state.user.name });
    closeModal();
    if(failedPayments)toast(`${failedPayments} initial payment(s) FAILED — check transaction history before retrying.`, 'error');
    else toast(`${added} student(s) added${skipped?`, ${skipped} skipped`:''}${batchMisses?`, ${batchMisses} batch code(s) not matched`:''}${nameDupes?`, ${nameDupes} names repeated`:''}${sharedContacts?`, ${sharedContacts} shared contacts`:''}`,'success');
    await Promise.all([loadStudents(),loadStudentBatchMemberships(),loadActivity(),refreshFinancialSummaries()]);
  }catch(e){ toast(e.message,'error'); }
  update();
}

function fmtDateOnly(isoDate){
  if (!isoDate) return '';
  const d = new Date(isoDate + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDuration(fromIso){
  if (!fromIso) return '';
  const ms = Date.now() - new Date(fromIso).getTime();
  if (ms < 0) return '0m';
  const mins = Math.floor(ms/60000);
  const days = Math.floor(mins/1440);
  const hours = Math.floor((mins%1440)/60);
  const remMins = mins%60;
  if (days>0) return `${days}d ${hours}h`;
  if (hours>0) return `${hours}h ${remMins}m`;
  return `${remMins}m`;
}

/* ============================================================
   ATTENDANCE — scan once per student per day; a repeat scan
   the same day is rejected with a clear error (date-wise, in
   the student's local calendar day, not the server's).
   ============================================================ */
function computeAttendanceGenderStats(markedList){
  const activeStudents = visibleStudents().filter(s=>!s.archived);
  const outIds = new Set(state.leaves.filter(l=>l.status==='out').map(l=>l.student_id));
  const markedByStudent = {}; markedList.forEach(a=>{ markedByStudent[a.student_id] = a; });
  const s = { malePresent:0, femalePresent:0, maleInCampus:0, femaleInCampus:0, maleOut:0, femaleOut:0, maleAbsent:0, femaleAbsent:0, absentList:[], presentList:[] };
  activeStudents.forEach(st=>{
    const g = st.gender;
    const isOut = outIds.has(st.id);
    const isMarked = !!markedByStudent[st.id];
    if (g==='male' || g==='female'){
      if (isMarked){ if (g==='male') s.malePresent++; else s.femalePresent++; }
      if (isOut){ if (g==='male') s.maleOut++; else s.femaleOut++; }
      else {
        if (g==='male') s.maleInCampus++; else s.femaleInCampus++;
        if (!isMarked){ if (g==='male') s.maleAbsent++; else s.femaleAbsent++; }
      }
    }
    if (isMarked) s.presentList.push(st);
    else if (!isOut) s.absentList.push(st);
  });
  return s;
}

async function recordAssignmentScan(code, sessionKey){
  if(!canDo('manage_assignments')){toast('Assignment permission denied.','error');return;}
  const normalized = String(code).trim();
  const key = sessionKey || (state.openAssignmentId+':'+normalized.toLowerCase());
  const viaCamera = state.scanning;
  try{
    let rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase());
    if (!rows.length){ await refreshOneStudent(normalized); rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase()); }
    if (!rows.length){
      buzz([30,30,30]); assignmentErrorCooldown[key]=Date.now();
      if (viaCamera) showAsnFeedback('error', `No match: ${normalized}`); else toast(`No student matches code "${normalized}".`,'error');
      return;
    }
    const student = rows[0];
    const asn=(state._assignments||[]).find(a=>a.id===state.openAssignmentId);
    if(!canViewStudent(student)||(asn?.batch_id && !isMemberOfBatch(student,asn.batch_id))){const msg='Student is outside the assignment batch or your permitted batch.';if(viaCamera)showAsnFeedback('error',msg);else toast(msg,'error');return;}
    await sbRpc('record_assignment_scan', { p_assignment_id: state.openAssignmentId, p_roll_no: student.roll_no });
    buzz(60);
    assignmentSessionResolved.add(key);
    if (viaCamera){
      if (!state._assignmentRecords) state._assignmentRecords = [];
      state._assignmentRecords.unshift({ id:'local-'+Date.now(), assignment_id: state.openAssignmentId, student_id: student.id, recorded_by_name: state.user.name, created_at: new Date().toISOString(), students:{ roll_no: student.roll_no, name: student.name } });
       assignmentSessionCount++;
       state.assignmentCounts[state.openAssignmentId]=(state.assignmentCounts[state.openAssignmentId]||0)+1;
       const totalEl=document.getElementById('assignment-recipient-count');if(totalEl)totalEl.textContent=state.assignmentCounts[state.openAssignmentId];
      const counterEl = document.getElementById('asn-session-counter'); if (counterEl) counterEl.textContent = assignmentSessionCount;
      showAsnFeedback('success', student.name);
    } else {
      toast(`✓ ${student.name} recorded.`,'success');
      Promise.all([loadAssignmentRecords(state.openAssignmentId),loadAssignmentCounts()]).then(([list])=>{state._assignmentRecords=list;update();});
    }
  }catch(e){
    buzz([30,30,30]);
    if (/already been recorded/i.test(e.message||'')) assignmentSessionResolved.add(key);
    else assignmentErrorCooldown[key] = Date.now();
    if (viaCamera) showAsnFeedback('error', e.message); else toast(e.message,'error');
  }
}

async function markAttendance(code, sessionKey){
  if(!canDo('take_attendance')){toast('Attendance access denied.','error');return;}
  const normalized = String(code).trim();
  const key = sessionKey || normalized.toLowerCase();
  if (!normalized){ toast('Enter a roll number first.','error'); return; }
  const viaCamera = state.scanning;
  try{
    let rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase());
    if (!rows.length){ await refreshOneStudent(normalized); rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase()); }
    if (!rows.length){
      buzz([30,30,30]);
      attendanceErrorCooldown[key] = Date.now();
      if (viaCamera) showAttFeedback('error', `No match: ${normalized}`); else toast(`No student matches code "${normalized}".`,'error');
      return;
    }
    const student = rows[0];
    if(!canViewStudent(student)){ if(viaCamera) showAttFeedback('error','Student is outside your selected batch.'); else toast('Student is outside your selected batch.','error');return; }
    const today = localDateStr();
    await sbRpc('mark_attendance', { p_roll_no: student.roll_no, p_date: today });
    buzz(60);
    attendanceSessionResolved.add(key);
    state.attDate = today;
    if (viaCamera){
      // Record locally WITHOUT a full re-render — re-rendering while the
      // camera is live would tear down and recreate its video element,
      // leaving the feed dark until the camera is restarted.
      if (!state._attendanceList) state._attendanceList = [];
      state._attendanceList.push({ id:'local-'+Date.now()+'-'+key, student_id: student.id, att_date: today, marked_by_name: state.user.name, created_at: new Date().toISOString(), students:{ roll_no: student.roll_no, name: student.name } });
      attendanceSessionCount++;
      const counterEl = document.getElementById('att-session-counter');
      if (counterEl) counterEl.textContent = attendanceSessionCount;
      showAttFeedback('success', student.name);
    } else {
      toast(`✓ ${student.name} marked present.`,'success');
      const list = await loadAttendanceForDate(today);
      state._attendanceList = list;
      update();
    }
  }catch(e){
    buzz([30,30,30]);
    if (/already marked/i.test(e.message||'')) attendanceSessionResolved.add(key); // known resolved state — no point retrying
    else attendanceErrorCooldown[key] = Date.now(); // e.g. out of campus — allow a retry later, just not every frame
    if (viaCamera) showAttFeedback('error', e.message); else toast(e.message,'error');
  }
}

function onLogoFileSelected(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      // Resize to a small fixed square so the stored value stays tiny and QR rendering stays fast
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
      const scale = Math.min(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      const dataUrl = canvas.toDataURL('image/png');
      if (state.modal) state.modal.preview = dataUrl;
      const holder = document.getElementById('logo-preview-holder');
      if (holder) holder.innerHTML = `<img src="${dataUrl}" alt="" />`;
      const btn = document.getElementById('logo-save-btn'); if (btn) btn.disabled = false;
    };
    img.onerror = ()=> toast('Could not read that image.','error');
    img.src = e.target.result;
  };
  reader.onerror = ()=> toast('Could not read that file.','error');
  reader.readAsDataURL(file);
}
