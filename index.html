async function reviewBackupFile(event){
 try{
   const file=event.target.files[0];if(!file)return;
   if(file.size>25*1024*1024)throw new Error('Backup exceeds 25 MB. Use Supabase recovery for large backups.');
   const parsed=JSON.parse(await file.text());
   if(parsed.format!=='vidya-gram-backup'||parsed.version!==1||!parsed.tables||!Array.isArray(parsed.tables.students)||!Array.isArray(parsed.tables.batches))throw new Error('Unsupported backup format.');
   if(parsed.tables.students.length>100000||parsed.tables.batches.length>5000)throw new Error('Backup size exceeds recovery limits.');
   if(!state.modal||state.modal.type!=='backupImport')return;
   state.modal.backup=parsed;state.modal.preview={batchCount:parsed.tables.batches.length,studentCount:parsed.tables.students.length};update();
 }catch(e){toast('Invalid backup: '+e.message,'error');}
}
async function restoreSafeBackup(){
 if(state.user?.role!=='admin'||state.modal?.type!=='backupImport')return;
 if(!document.getElementById('backup-confirm')?.checked){toast('Confirm the recovery conditions.','error');return;}
 const file=state.modal.backup;
 const btn=document.getElementById('backup-restore-btn');if(btn){btn.disabled=true;btn.textContent='Recovering…';}
 let batches=0,students=0,skipped=0,failures=0;
 try{
   const originalBatchIds=new Set((await sbSelectAll('batches','?select=id')).map(b=>b.id));
   for(const b of file.tables.batches||[]){
     if(!b.id||!b.name||originalBatchIds.has(b.id))continue;
     const payload={id:b.id,name:b.name,short_code:b.short_code||null,monthly_fee_amount:Number(b.monthly_fee_amount)||0,onetime_fee_amount:Number(b.onetime_fee_amount)||0};
     try{await sbInsert('batches',payload);batches++;originalBatchIds.add(b.id);}catch(e){failures++;}
   }
   const existingRolls=new Set((await sbSelectAll('students','?select=roll_no')).map(st=>String(st.roll_no).trim().toLowerCase()));
   for(const st of file.tables.students||[]){
     if(!st.roll_no||!st.name||existingRolls.has(String(st.roll_no).trim().toLowerCase())||Number(st.fee_paid||0)!==0||st.archived){skipped++;continue;}
     const allowed=['id','roll_no','name','room','gender','batch_id','father_name','mother_name','addr_village_town','addr_po','addr_ps','addr_district','addr_state','addr_pin','contacts','fee_mode','fee_total'];
     const payload={};allowed.forEach(k=>{if(Object.prototype.hasOwnProperty.call(st,k))payload[k]=st[k];});
     payload.fee_paid=0;
     if(payload.batch_id&&!originalBatchIds.has(payload.batch_id))payload.batch_id=null;
     try{await sbInsert('students',payload);existingRolls.add(String(st.roll_no).trim().toLowerCase());students++;}catch(e){failures++;}
   }
   // Only memberships belonging to successfully present student and batch IDs can be added.
   const presentStudents=new Set((await sbSelectAll('students','?select=id')).map(st=>st.id));
   const existingMemberships=new Set((await sbSelectAll('student_batches','?select=student_id,batch_id')).map(m=>m.student_id+':'+m.batch_id));
   for(const m of file.tables.student_batches||[]){
     const key=m.student_id+':'+m.batch_id;
     if(!presentStudents.has(m.student_id)||!originalBatchIds.has(m.batch_id)||existingMemberships.has(key))continue;
     try{await sbInsert('student_batches',{student_id:m.student_id,batch_id:m.batch_id});existingMemberships.add(key);}catch(e){failures++;}
   }
   await sbInsert('activity_log',{type:'backup_recovery',details:`Recovery: ${batches} batches, ${students} students; ${skipped} skipped, ${failures} failed`,by_name:state.user.name}).catch(()=>{});
   closeModal();await Promise.all([loadStudents(),loadBatches(),loadStudentBatchMemberships(),loadActivity()]);update();
   toast(`Recovered ${batches} batches and ${students} students; ${skipped} skipped, ${failures} failed.`,'success');
 }catch(e){toast('Recovery failed: '+e.message,'error');if(btn){btn.disabled=false;btn.textContent='Retry';}}
}

let mainCameraStartSerial=0;
async function initCamera(){
  if(!state.scanning||!document.getElementById('qr-reader'))return;
  if(typeof Html5Qrcode==='undefined'){
    toast('Scanner unavailable. Check your connection.','error');state.scanning=false;update();return;
  }
  const serial=++mainCameraStartSerial;
  let scanner;
  try{
    if(html5QrCode)await stopCamera();
    if(!state.scanning||!document.getElementById('qr-reader'))return;
    scanner=new Html5Qrcode('qr-reader');html5QrCode=scanner;
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:220},decoded=>handleScanSuccess(decoded),()=>{});
    if(!state.scanning||!document.getElementById('qr-reader'))await stopCamera();
  }catch(err){
    if(state.scanning){toast('Camera failed: '+(err?.message||err),'error');state.scanning=false;update();}
    if(scanner){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}}
    if(html5QrCode===scanner)html5QrCode=null;
  }
}
async function stopCamera(){
  const scanner=html5QrCode;
  html5QrCode=null;
  if(!scanner)return;
  try{await scanner.stop();}catch(e){}
  try{scanner.clear();}catch(e){}
}
function cancelScan(){
  const wasAttendance = currentScanMode()==='attendance';
  stopCamera(); state.scanning=false; update();
  if (wasAttendance){ loadAttendanceForDate(state.attDate||localDateStr()).then(list=>{ state._attendanceList=list; update(); }); }
}
function handleScanSuccess(decodedText){
  const mode = currentScanMode();
  if (mode==='attendance'){
    const key = decodedText.trim().toLowerCase();
    if (attendanceSessionResolved.has(key)) return; // already handled this session — stay completely silent
    if (attendancePending.has(key)) return; // a request for this code is already in flight
    const lastErr = attendanceErrorCooldown[key];
    if (lastErr && (Date.now()-lastErr) < 15000) return; // recently showed a retryable error for this code — wait before trying again
    attendancePending.add(key);
    markAttendance(decodedText, key).finally(()=>{ attendancePending.delete(key); });
    return; // keep the camera running for the next student
  }
  if (mode==='assignment'){
    const key = state.openAssignmentId + ':' + decodedText.trim().toLowerCase();
    if (assignmentSessionResolved.has(key)) return;
    if (assignmentPending.has(key)) return;
    const lastErr = assignmentErrorCooldown[key];
    if (lastErr && (Date.now()-lastErr) < 15000) return;
    assignmentPending.add(key);
    recordAssignmentScan(decodedText, key).finally(()=>{ assignmentPending.delete(key); });
    return; // keep the camera running for the next student
  }
  stopCamera(); state.scanning=false;
  if (mode==='gate') gateLookup(decodedText);
  else scanLookup(decodedText);
}
function submitManualLookup(){
  const val=(document.getElementById('manual-roll')?.value||'').trim(); if(!val){ toast('Enter a roll number first.','error'); return; }
  const mode = currentScanMode();
  if (mode==='gate') gateLookup(val);
  else if (mode==='attendance') markAttendance(val);
  else if (mode==='assignment') recordAssignmentScan(val);
  else scanLookup(val);
}
async function scanLookup(code){
  const normalized = String(code).trim();
  try{
    let rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase());
    if (!rows.length){ await refreshOneStudent(normalized); rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase()); }
    if (rows.length && canViewStudent(rows[0])){
      buzz(60);
      sbRpc('log_scan', { p_roll_no: rows[0].roll_no, p_student_name: rows[0].name }).then(()=>loadActivity()).catch(()=>{});
      openStudentProfile(rows[0].roll_no);
    } else {
      toast(`No student matches code "${normalized}".`,'error');
    }
  }catch(e){ toast('Lookup failed: '+e.message,'error'); }
}

  const uid = document.getElementById('pay-uid') ? document.getElementById('pay-uid').value.trim() : '';

  const dup = recentPayments.find(p => Number(p.amount)===amount && (Date.now()-new Date(p.created_at).getTime()) < 24*60*60*1000);

// Gate lookups use the secure batch-scoped RPC. A gatekeeper may serve multiple
// batches: searching only the selected UI batch made valid QR codes appear missing.
let gateLookupSeq=0;
function gateLookupBatchIds(){
  const assigned=userBatchIds().filter(id=>state.batches.some(b=>b.id===id));
  const selected=state.selectedBatchId;
  const ordered=selected&&assigned.includes(selected)?[selected,...assigned.filter(id=>id!==selected)]:assigned;
  // An administrator may select All batches; the server verifies each request.
  if(state.user&&state.user.role==='admin'&&selected&&!ordered.includes(selected))ordered.unshift(selected);
  if(state.user&&state.user.role==='admin'&&!ordered.length) return state.batches.map(b=>b.id);
  return ordered;
}
async function gateLookup(code){
  const roll=String(code==null?'':code).trim();
  const seq=++gateLookupSeq;
  if(!roll){toast('Enter or scan a roll number.','error');return;}
  const batchIds=gateLookupBatchIds();
  if(!batchIds.length){
    state.gateResult=null;update();
    toast('No authorized batches are available. Contact the administrator.','error');
    return;
  }
  let verified=false;
  let firstError=null;
  for(const batchId of batchIds){
    try{
      const rows=await sbRpc('vidya_gatekeeper_lookup',{p_roll_no:roll,p_batch_id:batchId});
      if(seq!==gateLookupSeq)return;
      verified=true;
      const student=rows&&rows[0];
      if(student){
        buzz(student.leave_status==='out'?[40,60,40]:60);
        state.gateResult={found:true,student};
        update();
        return;
      }
    }catch(e){if(!firstError)firstError=e;}
  }
  if(seq!==gateLookupSeq)return;
  if(!verified){
    state.gateResult=null;update();
    toast('Gate lookup failed: '+(firstError?.message||'Unable to verify student access.'),'error');
    return;
  }
  buzz([20,40,20,40,20]);
  state.gateResult={found:false,code:roll};update();
}

function renderModal(){
  if (!state.modal) return '';
  switch(state.modal.type){
    case 'idPrint': return idPrintModalHTML(state.modal);
    case 'backupImport': return backupImportModalHTML(state.modal);
    case 'studentForm': return studentFormModalHTML(state.modal.existing, state.modal.contacts);
    case 'profile': return profileModalHTML(state.modal.student, state.modal.payments, state.modal.leaveHistory, state.modal.attendanceHistory);
    case 'archive': return archiveModalHTML(state.modal.rollNo);
    case 'bulkImport': return bulkImportModalHTML();
    case 'grantLeave': return grantLeaveModalHTML(state.modal.rollNo);
    case 'batches': return batchesModalHTML();
    case 'staffBatches': return staffBatchesModalHTML(state.modal);
    case 'batchAssign': return batchAssignModalHTML(state.modal);
    case 'editPayment': return editPaymentModalHTML(state.modal.payment);
    case 'rowDetail': return rowDetailModalHTML(state.modal);
    case 'markFullPaid': return markFullPaidModalHTML(state.modal);
    case 'logHistoricalPayment': return logHistoricalPaymentModalHTML(state.modal);
    case 'newAssignment': return newAssignmentModalHTML();
    case 'missingPaymentCheck': return missingPaymentCheckModalHTML(state.modal);
    case 'logoUpload': return logoUploadModalHTML(state.modal);
    case 'changepw': return changePasswordModalHTML();
    case 'confirm': return `<div class="modal-overlay"><div class="modal modal-sm"><p>${esc(state.modal.message)}</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="runConfirmedAction()">Confirm</button></div></div></div>`;
    default: return '';
  }
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadTheme();
  await loadFontSize();
  render();
  applyFontSizeAttr();
  await loadConfig();
  if (!state.sbUrl || !state.sbAnonKey){ state.view='setup'; update(); return; }
  await loadPersistedSession();
  if (session){
    try{
      await getValidAccessToken();
      await loadMyProfile();
      if (state.user.role !== 'admin'){
        try{
          const approved = await sbSelect('login_requests', `?user_id=eq.${state.user.id}&device_id=eq.${DEVICE_ID}&status=eq.approved&select=id&limit=1`);
          if (!(approved && approved.length)){
            // This device isn't approved yet — check if it has a request already pending/denied
            const rows = await sbSelect('login_requests', `?user_id=eq.${state.user.id}&device_id=eq.${DEVICE_ID}&select=*&order=requested_at.desc&limit=1`);
            const latest = rows && rows[0];
            if (!latest || latest.status==='denied'){
              await requestLoginApproval();
              state.view='waiting-approval'; update(); startApprovalPolling(); return;
            } else if (latest.status==='pending'){
              state.myLoginRequestId = latest.id;
              state.view='waiting-approval'; update(); startApprovalPolling(); return;
            }
          }
        }catch(e){}
      }
      state.view='app';
      await loadAllForRole();
      startInactivityWatch();
      startDeviceHeartbeat();
    }catch(e){ await clearSession(); purgeLocalStudentData();state.user=null;state.view='login'; }
  } else { state.view='login'; }
  update();
}

/* Floating quick scan: separate overlay prevents main app re-renders destroying video. */
const quickScan={open:false,scanner:null,mode:'lookup',busy:false,lastCode:'',lastAt:0,startSerial:0,starting:false};
function quickScanModes(){
  if(!state.user)return [];
  if(state.user.role==='gatekeeper')return [{id:'gate',label:'Gate OUT / IN'}];
  const modes=[{id:'lookup',label:'Student'}];
  if(state.user.role==='admin'||canDo('take_attendance'))modes.push({id:'attendance',label:'Attendance'});
  if((state.user.role==='admin'||canDo('manage_assignments'))&&state.openAssignmentId)modes.push({id:'assignment',label:'Assignment'});
  return modes;
}
function syncQuickScan(){
  const root=document.getElementById('quick-scan-root');if(!root)return;
  if(state.view!=='app'||!state.user){if(quickScan.open)closeQuickScan();root.innerHTML='';return;}
  if(quickScan.open)return;
  root.innerHTML='<button type="button" class="qs-fab" aria-label="Open quick scanner" onclick="openQuickScan()" ontouchstart="quickScanTouchStart(event)" ontouchend="quickScanTouchEnd(event)"><span class="qs-up">⌃</span><span>Scan</span><span aria-hidden="true">▣</span></button>';
}
function quickScanMarkup(){
  const modes=quickScanModes();
  return `<div class="qs-shade" onclick="closeQuickScan()"></div><section class="qs-sheet" role="dialog" aria-modal="true" aria-label="Quick scan" id="qs-sheet">
    <div class="qs-grip"></div><div class="qs-head"><strong>Quick Scan</strong><button class="btn btn-ghost" onclick="closeQuickScan()" aria-label="Close scanner">✕</button></div>
    <div class="qs-tabs">${modes.map(m=>`<button type="button" class="${m.id===quickScan.mode?'active':''}" onclick="selectQuickScanMode('${m.id}')">${esc(m.label)}</button>`).join('')}</div>
    <div id="qs-reader"></div>
    <div class="qs-manual"><input id="qs-roll" autocomplete="off" placeholder="Roll number" onkeydown="if(event.key==='Enter')quickScanManual()"/><button class="btn btn-primary" onclick="quickScanManual()">Find</button></div>
    <div id="qs-status" class="qs-status" aria-live="polite"></div>
  </section>`;
}
let quickScanTouchY=null;
function quickScanTouchStart(e){quickScanTouchY=e.changedTouches?.[0]?.clientY??null;}
function quickScanTouchEnd(e){const y=e.changedTouches?.[0]?.clientY??null;if(quickScanTouchY!==null&&y!==null&&quickScanTouchY-y>35){e.preventDefault();void openQuickScan();}quickScanTouchY=null;}
function qsStatus(msg){const el=document.getElementById('qs-status');if(el)el.textContent=msg;}
async function openQuickScan(){
  if(quickScan.open||!state.user||state.view!=='app')return;
  if(state.scanning){await stopCamera();state.scanning=false;update();}
  quickScan.open=true;quickScan.mode=quickScanModes()[0]?.id||'lookup';quickScan.busy=false;
  const root=document.getElementById('quick-scan-root');root.innerHTML=quickScanMarkup();
  document.body.style.overflow='hidden';
  await startQuickScanCamera();
}
async function stopQuickScanCamera(){
  quickScan.startSerial++;
  const scanner=quickScan.scanner;quickScan.scanner=null;
  if(scanner){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}}
}
async function closeQuickScan(){
  quickScan.open=false;document.body.style.overflow='';
  await stopQuickScanCamera();
  syncQuickScan();
}
async function selectQuickScanMode(mode){
  if(!quickScanModes().some(m=>m.id===mode))return;
  await stopQuickScanCamera();quickScan.mode=mode;quickScan.busy=false;
  const root=document.getElementById('quick-scan-root');if(!quickScan.open)return;
  root.innerHTML=quickScanMarkup();await startQuickScanCamera();
}
async function startQuickScanCamera(){
  if(!quickScan.open)return;
  if(typeof Html5Qrcode==='undefined'){qsStatus('Camera scanner unavailable. Use roll number.');return;}
  const serial=++quickScan.startSerial;
  const node=document.getElementById('qs-reader');if(!node)return;
  let scanner;
  try{
    scanner=new Html5Qrcode('qs-reader');quickScan.scanner=scanner;
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:210,height:210}},code=>{void quickScanDetected(code);},()=>{});
    if(serial!==quickScan.startSerial||!quickScan.open){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}}
  }catch(e){if(quickScan.open)qsStatus('Camera unavailable. Use roll number or allow camera permission.');}
}
function quickScanManual(){const v=(document.getElementById('qs-roll')?.value||'').trim();if(v)void quickScanDetected(v);else qsStatus('Enter a roll number.');}
async function quickScanDetected(code){
  const roll=String(code||'').trim();if(!roll||quickScan.busy||!quickScan.open)return;
  const now=Date.now();if(roll===quickScan.lastCode&&now-quickScan.lastAt<1800)return;
  quickScan.lastCode=roll;quickScan.lastAt=now;quickScan.busy=true;
  const mode=quickScan.mode;
  if(mode==='assignment'&&(!state.openAssignmentId||!quickScanModes().some(m=>m.id==='assignment'))){qsStatus('Open an assignment first.');quickScan.busy=false;return;}
  if(mode==='attendance'&&!quickScanModes().some(m=>m.id==='attendance')){qsStatus('Access denied.');quickScan.busy=false;return;}
  if(mode==='lookup'||mode==='gate'){
    await closeQuickScan();
    if(mode==='gate'){state.gateTab='gate';state.gateResult=null;update();await gateLookup(roll);}else await scanLookup(roll);
    return;
  }
  try{
    if(mode==='attendance'){await markAttendance(roll);qsStatus('');}
    else if(mode==='assignment'){await recordAssignmentScan(roll);qsStatus('');}
  }finally{quickScan.busy=false;}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&quickScan.open){e.stopPropagation();void closeQuickScan();}});
window.addEventListener('afterprint',()=>{
  const area=document.getElementById('print-area');
  if(area){area.innerHTML='';area.removeAttribute('data-print-kind');}
});

init();
</script>
