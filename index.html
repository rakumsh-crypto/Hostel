<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#1E2230; --ink-soft:#666B7A; --border:#E4E6EE;
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-soft:#EEF0FF;
  --green:#1F9D6F; --green-soft:#E6F6EF; --red:#E0483E; --red-soft:#FDECEA;
  --amber:#C9810A; --amber-soft:#FBF1DE;
  --radius:16px; --radius-sm:11px;
  --shadow:0 1px 2px rgba(16,24,40,0.04), 0 6px 16px rgba(16,24,40,0.06);
  --font-display:'IBM Plex Sans',-apple-system,sans-serif;
  --font-body:'IBM Plex Sans',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
  --input-bg:#FAFBFD;
}
[data-theme="dark"]{
  --bg:#13151F; --surface:#1B1E2B; --ink:#EDEEF5; --ink-soft:#9AA0B4; --border:#2A2E40;
  --primary:#7C7AFF; --primary-dark:#9290FF; --primary-soft:#272650;
  --green:#3DCB8F; --green-soft:#163428; --red:#FF6B61; --red-soft:#3A1E1E;
  --amber:#E0A53D; --amber-soft:#3A2E12;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
  --input-bg:#22253A;
}
[data-theme="dark"] body{ background:var(--bg); }
[data-theme="dark"] .login-card input,
[data-theme="dark"] .form-grid input, [data-theme="dark"] .form-grid select, [data-theme="dark"] .form-grid textarea{
  background:var(--input-bg); color:var(--ink); border-color:var(--border);
}
[data-theme="dark"] .id-card{ color:#1E2230; } /* printed ID cards stay light/printable regardless of theme */
[data-theme="dark"] .table th, [data-theme="dark"] .att-split-head{ background:var(--surface); }
[data-theme="dark"] .att-list-row:hover{ background:var(--bg); }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-body); color:var(--ink); background:var(--bg); min-height:100vh;}
#app[data-font-size="large"]{zoom:1.15;}
#app[data-font-size="small"]{zoom:0.9;}
button,input,select,textarea{font-family:inherit; font-size:14px;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0 0 .4em 0; color:var(--ink);}
.mono{font-family:var(--font-mono);}
.muted{color:var(--ink-soft); font-size:13px;}
a{color:var(--primary);}

.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); padding:38px 34px; width:100%; max-width:420px;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-center{justify-content:center; flex-direction:column; text-align:center; margin-bottom:8px;}
.brand-mark{width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; flex-shrink:0; box-shadow:0 4px 10px rgba(79,70,229,.3);}
.brand-text{font-weight:800; font-size:19px; line-height:1.15;}
.login-tagline{text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 24px;}
.login-card label{display:block; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:16px;}
.login-card input{width:100%; margin-top:6px; padding:11px 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--input-bg); outline:none; font-size:15px; color:var(--ink);}
.login-card input:focus{border-color:var(--primary); background:#fff;}
.login-error{background:var(--red-soft); color:var(--red); border:1px solid #F6CFCB; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:16px;}
.login-hint{font-size:12px; color:var(--ink-soft); margin-top:16px; text-align:center; line-height:1.5;}
.loading-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--ink-soft);}
.loading-mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));}
.fatal-error{max-width:480px; margin:80px auto; text-align:center; padding:24px;}
.setup-note{background:var(--primary-soft); border:1px solid #D9D6FB; border-radius:10px; padding:10px 12px; font-size:12.5px; color:#41399A; line-height:1.5; margin-bottom:18px;}

.btn{border:none; border-radius:10px; padding:10px 17px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .05s ease, opacity .15s ease, background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.55; cursor:default;}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(79,70,229,.25);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:#fff; color:var(--ink); border:1.5px solid var(--border);}
.btn-secondary:hover{border-color:var(--primary); color:var(--primary);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid transparent;}
.btn-ghost:hover{color:var(--ink); background:#EEF0F4;}
.btn-danger{background:var(--red); color:#fff;}
.btn-amber{background:var(--amber); color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:14px 26px; font-size:16px;}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}
.link-btn{background:none; border:none; color:var(--primary); font-size:13px; cursor:pointer; padding:0; font-weight:600;}

.app-shell{display:flex; min-height:100vh;}
.sidebar{width:212px; flex-shrink:0; background:var(--ink); color:#fff; display:flex; flex-direction:column; padding:20px 0;}
.sidebar .brand{padding:0 20px 20px; color:#fff;}
.sidebar .brand-text{color:#fff;}
.nav-item{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:none; border:none; color:#A6ACC2; padding:11px 20px; font-size:14px; cursor:pointer; border-left:3px solid transparent; font-weight:500;}
.nav-item:hover{color:#fff; background:rgba(255,255,255,.05);}
.nav-item.active{color:#fff; background:rgba(255,255,255,.08); border-left-color:var(--primary); font-weight:700;}
.nav-badge{background:var(--red); color:#fff; font-size:10px; font-weight:800; border-radius:20px; padding:2px 7px;}
.main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border-bottom:1px solid var(--border); padding:16px 26px; flex-wrap:wrap; gap:8px;}
.topbar-title{font-size:19px; font-weight:800;}
.topbar-user{display:flex; align-items:center; gap:11px; font-size:13px; flex-wrap:wrap;}
.role-badge{font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px; border-radius:20px; font-weight:700;}
.role-admin{background:var(--primary-soft); color:var(--primary-dark);}
.role-accountant{background:var(--green-soft); color:var(--green);}
.role-gatekeeper{background:var(--amber-soft); color:var(--amber);}
.role-viewer{background:#EEE; color:var(--ink-soft);}
.user-name{font-weight:700;}
.account-icon-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:14px; line-height:1;}
.account-icon-btn:hover{border-color:var(--primary); color:var(--primary);}
.main{padding:26px; overflow-y:auto;}
@media (max-width:760px){
  .app-shell{flex-direction:column;}

function getOrCreateDeviceId(){
  try{
    let id = localStorage.getItem('hostel-device-id');
    if (!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('dev-'+Date.now()+'-'+Math.random().toString(36).slice(2));
      localStorage.setItem('hostel-device-id', id);
    }
    return id;
  }catch(e){ return 'dev-fallback-'+Date.now(); } // e.g. private browsing blocking localStorage — falls back to a session-only id, meaning this one session will need approval again next time, but nothing breaks
}
const DEVICE_ID = getOrCreateDeviceId();
async function storageGet(key, shared){
  if (hasClaudeStorage){ try{ const res = await window.storage.get(key, shared); return res ? res.value : null; }catch(e){ return null; } }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if (hasClaudeStorage){ try{ await window.storage.set(key, value, shared); }catch(e){} return; }
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function storageDelete(key, shared){
  if (hasClaudeStorage){ try{ await window.storage.delete(key, shared); }catch(e){} return; }
  try{ localStorage.removeItem(key); }catch(e){}
}

async function sbSignIn(email, password){
  const res = await fetch(`${state.sbUrl}/auth/v1/token?grant_type=password`, { method:'POST', headers:{ apikey:state.sbAnonKey, 'Content-Type':'application/json' }, body: JSON.stringify({ email, password }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed.');
  return data;
}
async function sbRefresh(refresh_token){
  const res = await fetch(`${state.sbUrl}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey:state.sbAnonKey, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token }) });
  const data = await res.json();
  if (!res.ok) throw new Error('Session expired.');
  return data;
}
async function getValidAccessToken(){
  if (!session) throw new Error('Not signed in.');
  if (Date.now() > session.expires_at - 30000){
    let fresh;
    try{ fresh = await sbRefresh(session.refresh_token); }
    catch(e){ await handleSessionExpired(); throw new Error('__session_expired__'); }
    session = { access_token: fresh.access_token, refresh_token: fresh.refresh_token, expires_at: Date.now() + fresh.expires_in*1000, user: fresh.user || session.user };
    await persistSession();
  }
  return session.access_token;
}
async function handleSessionExpired(){
  stopCamera();
  if (approvalPollInterval){ clearInterval(approvalPollInterval); approvalPollInterval=null; }
  stopInactivityWatch();
  await clearSession();
  state.user = null; state.scanResult=null; state.gateResult=null; state.scanning=false; state.modal=null;
  state.view = 'login';
  state.loginError = 'Your session expired — please log in again.';
  update();
}
async function sbRequest(path, opts){
  opts = opts || {};
  const token = await getValidAccessToken();
  const res = await fetch(`${state.sbUrl}/rest/v1${path}`, {
    method: opts.method || 'GET',
    headers: Object.assign({ apikey:state.sbAnonKey, Authorization:`Bearer ${token}`, 'Content-Type':'application/json', 'X-Device-Id':DEVICE_ID }, opts.headers||{}),
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
  });
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
  if (!res.ok){
    const msg = (data && (data.message || data.error_description || data.hint)) || (typeof data === 'string' ? data : 'Request failed.');
    throw new Error(msg);
  }
  return data;
}
function sbSelect(table, query){ return sbRequest(`/${table}${query||''}`); }
function sbInsert(table, row){ return sbRequest(`/${table}`, { method:'POST', body: row, headers:{ Prefer:'return=representation' } }); }
function sbUpdate(table, query, patch){ return sbRequest(`/${table}${query}`, { method:'PATCH', body: patch, headers:{ Prefer:'return=representation' } }); }
function sbUpsert(table, row, onConflict){ return sbRequest(`/${table}?on_conflict=${onConflict}`, { method:'POST', body: row, headers:{ Prefer:'resolution=merge-duplicates,return=representation' } }); }
function sbDelete(table, query){ return sbRequest(`/${table}${query}`, { method:'DELETE' }); }

function filterByDate(list, from, to, field){
  if (!from && !to) return list;
  return list.filter(item=>{

    const d = new Date(raw);
    if (from && d < new Date(from+'T00:00:00')) return false;

    return true;
  });
}
function computeStats(){
  const totalStudents = state.students.length;
  const totalDue = state.students.reduce((sum,s)=>sum+Math.max(0,(s.fee_total||0)-(s.fee_paid||0)),0);
  const totalDiscounts = state._totalDiscounts || 0;
  const totalCollected = Math.max(0, state.students.reduce((sum,s)=>sum+(s.fee_paid||0),0) - totalDiscounts);
  const totalAccountants = state.accounts.filter(a=>a.role==='accountant').length;
  const totalOut = state.leaves.filter(l=>l.status==='out').length;
  const fullyPaid = state.students.filter(s=>(s.fee_total||0)<=(s.fee_paid||0)).length;
  const male = state.students.filter(s=>s.gender==='male').length;
  const female = state.students.filter(s=>s.gender==='female').length;
  return { totalStudents, totalDue, totalCollected, totalDiscounts, totalAccountants, totalOut, fullyPaid, male, female, present: totalStudents-totalOut };
}

function drawLogoOnQR(el){
  if (!cachedLogoImg) return;
  const canvas = el.querySelector('canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const logoSize = size * 0.22; // kept small and centered — well within the High error-correction level's recovery margin, so the code still scans reliably
  const x = (size-logoSize)/2, y = (size-logoSize)/2;
  const pad = logoSize*0.12;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x-pad, y-pad, logoSize+pad*2, logoSize+pad*2);
  ctx.drawImage(cachedLogoImg, x, y, logoSize, logoSize);
}

function update(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==='number' ? active.selectionEnd : null;
  render();
  if (activeId){ const el=document.getElementById(activeId); if (el){ el.focus(); if (selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd); }catch(e){} } } }
  runPostRenderEffects();
}
const photoUrlCache = {}; // photo_path -> { url, expiresAt }
const photoFetchInFlight = {}; // photo_path -> Promise, to avoid duplicate concurrent fetches for the same photo
async function getCachedPhotoUrl(photoPath){
  if (!photoPath) return null;
  const cached = photoUrlCache[photoPath];
  if (cached && cached.expiresAt > Date.now()) return cached.url;
  if (photoFetchInFlight[photoPath]) return photoFetchInFlight[photoPath];
  const p = sbSignedUrl('student-photos', photoPath, 21600).then(url=>{ // 6 hours
    delete photoFetchInFlight[photoPath];
    if (url) photoUrlCache[photoPath] = { url, expiresAt: Date.now() + 21000*1000 }; // cache slightly under the actual signed-URL validity
    return url;
  }).catch(()=>{ delete photoFetchInFlight[photoPath]; return null; });
  photoFetchInFlight[photoPath] = p;
  return p;
}
function applyPhoto(elementId, student, cacheHolder){
  const holder = document.getElementById(elementId);
  if (!holder || !student || !student.photo_path) return;
  const cached = photoUrlCache[student.photo_path];
  if (cached && cached.expiresAt > Date.now()){ holder.innerHTML = `<img src="${cached.url}" alt="${esc(student.name||'')}" />`; return; }
  getCachedPhotoUrl(student.photo_path).then(url=>{
    if (!url) return;
    const h = document.getElementById(elementId);
    if (h) h.innerHTML = `<img src="${url}" alt="${esc(student.name||'')}" />`;
  });
}

}

  if (!email || !password){ state.loginError='Enter both email and password.'; update(); return; }
  const btn = document.getElementById('login-submit-btn'); if (btn){ btn.disabled=true; btn.textContent='Signing in…'; }
  try{
    const data = await sbSignIn(email, password);
    session = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now()+data.expires_in*1000, user:data.user };
    await persistSession();
    await loadMyProfile();
    state.loginError = null;
    if (state.user.role === 'admin'){
      state.view='app'; state.adminTab='dashboard'; state.accTab='scan'; state.gateTab='gate'; state.viewerTab='dashboard';
      await loadAllForRole();

      const already = await sbSelect('login_requests', `?user_id=eq.${state.user.id}&device_id=eq.${DEVICE_ID}&status=eq.approved&select=id&limit=1`).catch(()=>[]);
      if (already && already.length){

        state.view='app'; state.adminTab='dashboard'; state.accTab='scan'; state.gateTab='gate'; state.viewerTab='dashboard';
        await loadAllForRole();

        startDeviceHeartbeat();
      } else {
        await requestLoginApproval();
        state.view='waiting-approval';
        update();
        startApprovalPolling();
      }
    }
  }catch(e){
    await clearSession();
    state.loginError = e.message==='inactive' ? 'Your account has been disabled. Contact your administrator.' : (e.message||'Login failed.');
    update();
  }

/* ============================================================
   INACTIVITY AUTO-LOGOUT
   Security measure for shared/front-desk devices: signs the person
   out after a period with no real interaction (clicks, taps, key
   presses). A warning toast appears shortly before it happens so
   an actively-reading-but-not-clicking person has a chance to
   notice. Scanning/typing counts as activity via the same listeners.
   ============================================================ */
const INACTIVITY_LIMIT_MS = 15 * 24 * 60 * 60 * 1000; // 15 days
const INACTIVITY_WARNING_MS = 60 * 60 * 1000; // warn 1 hour before
let lastActivityAt = Date.now();
let inactivityInterval = null;
let inactivityWarned = false;
function markActivity(){ lastActivityAt = Date.now(); inactivityWarned = false; }
let heartbeatInterval = null;
function startDeviceHeartbeat(){
  if (heartbeatInterval || !state.user || state.user.role==='admin') return; // admin never goes through device approval, nothing to track
  const ping = async ()=>{
    try{
      const status = await sbRpc('touch_device_heartbeat', {});
      if (status === 'denied'){
        clearInterval(heartbeatInterval); heartbeatInterval = null;
        toast('Access for this device was revoked by an admin.','error');
        logout();
      } else if (!status){
        // No device-specific approval on record at all for this session — most likely this
        // account's old approval predates device-tracking. Sign out cleanly so the normal
        // login flow can request fresh approval for this device, rather than leaving the
        // person looking at silently broken/empty screens for the rest of the session.
        clearInterval(heartbeatInterval); heartbeatInterval = null;
        toast('Please log in again to approve this device.','error');
        logout();
      }
    }catch(e){}
  };
  ping();
  heartbeatInterval = setInterval(ping, 3*60*1000);
}
function stopDeviceHeartbeat(){ if (heartbeatInterval){ clearInterval(heartbeatInterval); heartbeatInterval=null; } }
function friendlyDeviceLabel(ua){
  if (!ua) return 'Unknown device';
  const isTablet = /iPad|Tablet/i.test(ua);
  let os = 'Unknown OS';
  if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone/i.test(ua)) os = 'iPhone';
  else if (/iPad/i.test(ua)) os = 'iPad';
  else if (/Windows/i.test(ua)) os = 'Windows';
  else if (/Mac OS X/i.test(ua)) os = 'Mac';
  else if (/Linux/i.test(ua)) os = 'Linux';
  let browser = '';
  if (/Edg\//i.test(ua)) browser = 'Edge';
  else if (/Chrome\//i.test(ua)) browser = 'Chrome';
  else if (/CriOS/i.test(ua)) browser = 'Chrome';
  else if (/Firefox\//i.test(ua)) browser = 'Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
  return browser ? `${os} · ${browser}${isTablet?' (tablet)':''}` : os;
}
function startInactivityWatch(){
  if (inactivityInterval) return;
  lastActivityAt = Date.now(); inactivityWarned = false;
  ['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, markActivity, true));
  inactivityInterval = setInterval(()=>{
    if (!state.user) return;
    const idleFor = Date.now() - lastActivityAt;
    if (idleFor > INACTIVITY_LIMIT_MS){
      toast('Logged out automatically after 15 days of inactivity, for security.','error');
      logout();
    } else if (!inactivityWarned && idleFor > INACTIVITY_LIMIT_MS - INACTIVITY_WARNING_MS){
      inactivityWarned = true;
      toast('You will be logged out soon due to inactivity — tap anywhere to stay signed in.','error');
    }
  }, 5*60*1000);
}
function stopInactivityWatch(){
  if (inactivityInterval){ clearInterval(inactivityInterval); inactivityInterval=null; }
  ['click','keydown','touchstart'].forEach(evt => document.removeEventListener(evt, markActivity, true));
}

async function refreshOneStudent(rollNo){
  // Patches just the one changed row into state.students in place, instead of
  // re-fetching the entire table (every column, every student, no limit) —
  // that full-table pattern is what was driving egress usage far out of
  // proportion to the actual database size.
  if (!rollNo) return;
  try{
    const rows = await sbSelect('students', `?roll_no=eq.${encodeURIComponent(rollNo)}&select=*&limit=1`);
    const fresh = rows && rows[0];
    if (!fresh) return; // e.g. archived/purged since — a full loadStudents() elsewhere will reconcile the list view
    const idx = state.students.findIndex(s=>s.id===fresh.id);
    if (idx!==-1) state.students[idx] = fresh; else state.students.unshift(fresh);
  }catch(e){ /* non-fatal — the on-screen data just stays one action stale until the next full load */ }
}
function removeStudentFromState(rollNo){
  const idx = state.students.findIndex(s=>s.roll_no.toLowerCase()===String(rollNo).toLowerCase());

function renderPaginatedStudentList(list){
  const body = state.studentGroupView ? renderStudentsGroupedByGenderRoom(list) : `<div class="student-grid">${list.map(renderStudentCard).join('')}</div>`;

function loadMoreStudents(){ state.studentsPage = (state.studentsPage||1) + 1; update(); }
function resetStudentsPagination(){ state.studentsPage = 1; }
function onSearchInput(val){ state.search=val; resetStudentsPagination(); update(); }
function setStudentsView(v){ state.studentsView=v; state.search=''; resetStudentsPagination(); loadStudents().then(update); }
function setStudentGroupView(v){ state.studentGroupView=v; resetStudentsPagination(); update(); }
function groupStudentsByRoom(arr){
  const withRoom = {}; const withoutRoom = [];
  arr.forEach(s=>{
    const r = (s.room||'').trim();
    if (!r){ withoutRoom.push(s); return; }
    if (!withRoom[r]) withRoom[r] = [];
    withRoom[r].push(s);
  });
  const roomKeys = Object.keys(withRoom).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
  return { roomKeys, withRoom, withoutRoom };
}
function renderGenderSection(title, arr){
  if (!arr.length) return '';
  const { roomKeys, withRoom, withoutRoom } = groupStudentsByRoom(arr);
  return `<div class="gender-section">
    <h3 class="gender-section-title">${esc(title)} (${arr.length})</h3>
    ${roomKeys.map(r=>`<div class="room-group">
      <div class="room-group-title">Room ${esc(r)}</div>
      <div class="student-grid">${withRoom[r].map(renderStudentCard).join('')}</div>
    </div>`).join('')}
    ${withoutRoom.length? `<div class="student-grid">${withoutRoom.map(renderStudentCard).join('')}</div>` : ''}
  </div>`;
}
function renderStudentsGroupedByGenderRoom(list){
  const male = list.filter(s=>s.gender==='male');
  const female = list.filter(s=>s.gender==='female');
  const other = list.filter(s=>s.gender!=='male' && s.gender!=='female');
  const html = renderGenderSection('Male', male) + renderGenderSection('Female', female) + renderGenderSection('Not specified', other);
  return html || `<div class="card"><p class="empty-hint">No students match.</p></div>`;
}
function setSortBy(v){ state.sortBy=v; resetStudentsPagination(); update(); }
function setDuesFilter(v){ state.duesFilter=v; resetStudentsPagination(); update(); }
function setRegDateFilter(from,to){ state.regFrom=from||null; state.regTo=to||null; resetStudentsPagination(); update(); }
function loadPhotosForVisibleCards(){
  document.querySelectorAll('[data-photo-for]').forEach(el=>{
    const id = el.getAttribute('data-photo-for');
    const s = state.students.find(x=>x.id===id);
    if (!s || !s.photo_path) return;
    const cached = photoUrlCache[s.photo_path];
    if (cached && cached.expiresAt > Date.now()){ el.innerHTML = `<img src="${cached.url}" alt="${esc(s.name)}" />`; return; }
    getCachedPhotoUrl(s.photo_path).then(url=>{
      if (!url || !el.isConnected) return;
      el.innerHTML = `<img src="${url}" alt="${esc(s.name)}" />`;
    });
  });
}

async function addBatch(){
  const name = document.getElementById('batch-name').value.trim();
  const shortCode = document.getElementById('batch-shortcode').value.trim();
  const monthly = Math.max(0,parseFloat(document.getElementById('batch-monthly').value)||0);
  const onetime = Math.max(0,parseFloat(document.getElementById('batch-onetime').value)||0);
  if (!name){ toast('Enter a batch name.','error'); return; }
  try{ await sbInsert('batches',{name, short_code:shortCode||null, monthly_fee_amount:monthly, onetime_fee_amount:onetime}); toast('Batch added.','success'); await loadBatches(); }
  catch(e){ toast(e.message,'error'); }
  update();
}
function deleteBatch(id){
  confirmAction('Delete this batch? Students already assigned to it keep their current fee settings.', async ()=>{
    try{ await sbDelete('batches', `?id=eq.${id}`); toast('Batch deleted.','success'); await loadBatches(); }
    catch(e){ toast(e.message,'error'); }
    update();
  });
}
function onBatchChange(){ applyBatchFeeAmount(); }
function onOnlinePaidChange(){
  const amount = parseFloat(document.getElementById('f-online-paid').value)||0;
  const el = document.getElementById('f-reg-online-fields');
  if (el) el.style.display = amount>0 ? 'grid' : 'none';
}
function applyBatchFeeAmount(){
  const batchId = document.getElementById('f-batch').value;
  const batch = state.batches.find(b=>b.id===batchId);
  if (!batch) return;
  const mode = document.getElementById('f-feemode').value;
  const amount = mode==='monthly' ? batch.monthly_fee_amount : batch.onetime_fee_amount;
  if (amount) document.getElementById('f-feetotal').value = amount;
}

function openBatchAssignModal(batchId){ state.modal = { type:'batchAssign', batchId, search:'', changes:{} }; update(); }

function onBatchAssignSearch(v){ state.modal.search=v; update(); }
function toggleBatchAssignStudent(studentId, checked){ state.modal.changes[studentId]=checked; }
function toggleBatchAssignAll(checked){
  const q = (state.modal.search||'').trim().toLowerCase();
  const list = state.students.filter(s=> !q || s.name.toLowerCase().includes(q) || s.roll_no.toLowerCase().includes(q));

async function submitBatchAssign(){
  const batchId = state.modal.batchId;
  const changes = state.modal.changes;
  const ids = Object.keys(changes);
  if (!ids.length){ toast('No changes to save.','success'); closeModal(); return; }
  const btn = document.getElementById('batch-assign-btn'); if (btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    for (let i=0; i<ids.length; i+=10){
      const chunk = ids.slice(i, i+10);
      await Promise.all(chunk.map(id => sbUpdate('students', `?id=eq.${id}`, { batch_id: changes[id] ? batchId : null })));
    }
    toast(`Updated ${ids.length} student(s).`,'success');
    await loadStudents();
    closeModal();
  }catch(e){ toast(e.message,'error'); if (btn){ btn.disabled=false; btn.textContent='Save assignments'; } }
}

async function submitStudentForm(){
  syncContactsFromDOM();
  const originalRollNo = state.modal && state.modal.originalRollNo;
  const rollNo = document.getElementById('f-rollno').value.trim();
  const name = toTitleCase(document.getElementById('f-name').value.trim());
  const room = document.getElementById('f-room').value.trim();
  const gender = document.getElementById('f-gender').value || null;
  const batchId = document.getElementById('f-batch').value || null;
  const father = toTitleCase(document.getElementById('f-father').value.trim());
  const mother = toTitleCase(document.getElementById('f-mother').value.trim());
  const addrVillage = toTitleCase((document.getElementById('f-addr-village')||{value:''}).value.trim());
  const addrPo = toTitleCase((document.getElementById('f-addr-po')||{value:''}).value.trim());
  const addrPs = toTitleCase((document.getElementById('f-addr-ps')||{value:''}).value.trim());
  const addrDistrict = toTitleCase((document.getElementById('f-addr-district')||{value:''}).value.trim());
  const addrState = toTitleCase((document.getElementById('f-addr-state')||{value:''}).value.trim());
  const addrPin = (document.getElementById('f-addr-pin')||{value:''}).value.trim();
  const feeMode = document.getElementById('f-feemode').value;
  const feeTotal = Math.max(0, parseFloat(document.getElementById('f-feetotal').value) || 0);
  const photoFile = document.getElementById('f-photo').files[0] || null;
  const contacts = (state.modal.contacts||[]).filter(c=>c.phone && c.phone.trim()).map(c=>({ label: toTitleCase((c.label||'').trim()) || 'Contact', phone: c.phone.trim() }));
  if (!rollNo || !name){ toast('Roll number and name are required.','error'); return; }

  let cashPaid=0, onlinePaid=0, initUid='', initBank='';
  if (!originalRollNo){
    cashPaid = Math.max(0, parseFloat((document.getElementById('f-cash-paid')||{value:'0'}).value) || 0);
    onlinePaid = Math.max(0, parseFloat((document.getElementById('f-online-paid')||{value:'0'}).value) || 0);
    initUid = (document.getElementById('f-payuid')||{value:''}).value.trim();
    initBank = (document.getElementById('f-paybank')||{value:''}).value.trim();
    if (onlinePaid>0 && (!initUid || !initBank)){ toast('Enter the transaction UID and bank for the online portion.','error'); return; }
  }
  const payload = { name, room, gender, batch_id:batchId, father_name:father, mother_name:mother,
    addr_village_town:addrVillage, addr_po:addrPo, addr_ps:addrPs, addr_district:addrDistrict, addr_state:addrState, addr_pin:addrPin,
    contacts, fee_mode:feeMode, fee_total:feeTotal };
  const args = { rollNo, name, payload, originalRollNo, photoFile, cashPaid, onlinePaid, initUid, initBank };

  // Hard block: roll number already belongs to someone else — checked via RPC so this
  // works correctly even for accountants without recycle-bin viewing permission (a direct
  // table query would silently miss archived duplicates for them, per the RLS split).
  if (!originalRollNo){
    try{
      const rows = await sbRpc('check_roll_no_available', { p_roll_no: rollNo });
      const result = rows && rows[0];
      if (result && result.is_taken){
        toast(result.is_archived ? `Roll number "${rollNo}" belongs to an archived student (${result.student_name}) — restore them from the recycle bin, or use a different roll number.` : `Roll number "${rollNo}" is already in use by an existing student.`, 'error');
        return;
      }
    }catch(e){ /* if the check itself fails, fall through — the insert will still safely reject a true duplicate */ }
  }
  // Soft check: same name exists elsewhere — could be the same person re-entered, or just a coincidence
  const nameDup = state.students.find(s => s.name.trim().toLowerCase()===name.toLowerCase() && s.roll_no.toLowerCase()!==(originalRollNo||'').toLowerCase());
  if (nameDup){
    confirmAction(`A student named "${name}" already exists — roll ${nameDup.roll_no}, room ${nameDup.room||'—'}. Continue adding this as a separate student?`, ()=> actuallySubmitStudent(args));
    return;
  }
  await actuallySubmitStudent(args);
}
async function actuallySubmitStudent({ rollNo, name, payload, originalRollNo, photoFile, cashPaid, onlinePaid, initUid, initBank }){
  const btn = document.getElementById('student-save-btn'); if (btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    if (!originalRollNo){
      payload.fee_paid = 0;
      const inserted = await sbInsert('students', Object.assign({ roll_no: rollNo }, payload));
      const row = inserted[0];
      if (photoFile){ const path = await uploadStudentPhoto(row.id, photoFile); await sbUpdate('students', `?id=eq.${row.id}`, { photo_path: path }); }
      if ((cashPaid||0) > 0 || (onlinePaid||0) > 0){
        try{ await sbRpc('record_split_payment', { p_roll_no: rollNo, p_cash_amount: cashPaid||0, p_online_amount: onlinePaid||0, p_uid: initUid, p_bank: initBank }); }
        catch(payErr){ toast('Student added, but the initial payment could not be recorded: '+payErr.message, 'error'); }
      }
      await sbInsert('activity_log', { type:'student_add', roll_no: rollNo, details:`${name} (${rollNo})`, by_name: state.user.name });
      await Promise.all([refreshOneStudent(rollNo), loadActivity()]);
      // Continuous add mode: reset to a fresh blank form instead of closing,
      // so many students can be added in a row without reopening the modal each time.
      state.modal = { type:'studentForm', existing:null, originalRollNo:null, contacts:[{label:'Student',phone:''},{label:'Guardian',phone:''}] };
      update();
      toast(`${name} added — ready for the next student.`,'success');
      const rollInput = document.getElementById('f-rollno'); if (rollInput) rollInput.focus();
    } else {
      const row = state.students.find(s=>s.roll_no.toLowerCase()===originalRollNo.toLowerCase());
      const patch = Object.assign({}, payload);
      if (photoFile){ patch.photo_path = await uploadStudentPhoto(row.id, photoFile); }
      await sbUpdate('students', `?id=eq.${row.id}`, patch);
      await sbInsert('activity_log', { type:'student_edit', roll_no: rollNo, details:`${name} (${rollNo})`, by_name: state.user.name });
      closeModal();
      await Promise.all([refreshOneStudent(rollNo), loadActivity()]);
      update();
      toast('Student updated.','success');
    }
  }catch(e){ toast(e.message,'error'); if (btn){ btn.disabled=false; btn.textContent = originalRollNo?'Save changes':'Add student'; } }
}
function resizeImageForUpload(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 500;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob=>{ resolve(blob || file); }, 'image/jpeg', 0.82);
      };
      img.onerror = ()=> resolve(file); // fall back to the original file if it can't be decoded as an image
      img.src = e.target.result;
    };
    reader.onerror = ()=> resolve(file);
    reader.readAsDataURL(file);
  });
}
async function uploadStudentPhoto(studentId, file){
  const resized = await resizeImageForUpload(file);
  return await sbUploadFile('student-photos', `${studentId}.jpg`, resized);
}
const PHOTO_ALREADY_SMALL_BYTES = 150*1024; // skip re-processing photos already under ~150KB
async function runBulkPhotoCompression(){
  let rows;
  try{ rows = await sbSelect('students', '?select=id,roll_no,photo_path&photo_path=not.is.null'); }
  catch(e){ toast('Could not load the student photo list: '+e.message,'error'); return; }
  if (!rows.length){ toast('No students have a photo on file.','success'); return; }

  state._photoCompressProgress = { done:0, total:rows.length, compressed:0, skipped:0, failed:0, savedMB:0, running:true };
  update();

  let savedBytes = 0;
  for (const s of rows){
    try{
      const original = await sbDownloadFile('student-photos', s.photo_path);
      if (original.size <= PHOTO_ALREADY_SMALL_BYTES){
        state._photoCompressProgress.skipped++;
      } else {
        const compressed = await resizeImageForUpload(original);
        const newPath = `${s.id}.jpg`;
        await sbUploadFile('student-photos', newPath, compressed);
        if (newPath !== s.photo_path){
          await sbUpdate('students', `?id=eq.${s.id}`, { photo_path:newPath });
          await sbDeleteFile('student-photos', s.photo_path); // best-effort cleanup of the old-format original
        }
        savedBytes += Math.max(0, original.size - compressed.size);
        state._photoCompressProgress.compressed++;
        state._photoCompressProgress.savedMB = Math.round(savedBytes/1024/1024*10)/10;
        delete photoUrlCache[s.photo_path]; delete photoUrlCache[newPath]; // don't keep serving a stale cached link to the file we just replaced
      }
    }catch(e){ state._photoCompressProgress.failed++; }
    state._photoCompressProgress.done++;
    update();
  }
  state._photoCompressProgress.running = false;
  toast('Photo compression complete.','success');
  update();
}

const CSV_COLUMN_ALIASES = {
  rollno: ['rollno','roll','rollnumber'],
  name: ['name','studentname','fullname'],
  room: ['room','roomno','roomnumber'],
  gender: ['gender','sex'],
  batch: ['batch','batchcode','batchname'],
  fathername: ['fathername','fathersname','father'],
  mothername: ['mothername','mothersname','mother'],
  villagetown: ['villagetown','village','town','villagetownname'],
  po: ['po','postoffice'],
  ps: ['ps','policestation','thana'],
  district: ['district'],
  state: ['state'],
  pin: ['pin','pincode','postalcode','zip'],
  address: ['address'],
  contacts: ['contacts','contact','phone','phonenumber','phonenumbers'],
  feemode: ['feemode','mode'],
  feetotal: ['feetotal','totalfee','fee','amount'],
  cashpaid: ['cashpaid','cash','feepaid','paid','amountpaid'],
  onlinepaid: ['onlinepaid','online'],
  onlineuid: ['onlineuid','uid','utr','transactionid'],
  onlinebank: ['onlinebank','bank']
};
const CSV_DEFAULT_ORDER = ['rollno','name','room','gender','batch','fathername','mothername','villagetown','po','ps','district','state','pin','contacts','feemode','feetotal','cashpaid','onlinepaid','onlineuid','onlinebank'];
function normalizeHeaderToken(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z]/g,''); }
async function parseAndImportCSV(){
  const raw = document.getElementById('csv-textarea').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if (!lines.length){ toast('Paste or upload some CSV data first.','error'); return; }
  const btn = document.getElementById('import-btn'); if (btn){ btn.disabled=true; btn.textContent='Importing…'; }

  const firstRowTokens = lines[0].split(',').map(normalizeHeaderToken);
  const looksLikeHeader = firstRowTokens.some(t=>CSV_COLUMN_ALIASES.rollno.includes(t)) && firstRowTokens.some(t=>CSV_COLUMN_ALIASES.name.includes(t));
  const dataLines = looksLikeHeader ? lines.slice(1) : lines;

  function colIndex(key){
    if (looksLikeHeader){
      const aliases = CSV_COLUMN_ALIASES[key] || [key];
      for (const a of aliases){ const idx = firstRowTokens.indexOf(a); if (idx!==-1) return idx; }
      return -1;
    }
    return CSV_DEFAULT_ORDER.indexOf(key);
  }
  const idx = {}; CSV_DEFAULT_ORDER.forEach(k=>{ idx[k]=colIndex(k); });
  function getVal(parts, key){ const i=idx[key]; return (i===-1 || i==null) ? '' : (parts[i]||'').trim(); }

  let added=0, skipped=0, batchMisses=0, nameDupes=0;
  let allExisting;
  try{ allExisting = await sbSelect('students', '?select=roll_no,name'); }catch(e){ allExisting = state.students; }
  const existingRolls = new Set(allExisting.map(s=>s.roll_no.toLowerCase()));
  const existingNames = new Set(allExisting.map(s=>s.name.trim().toLowerCase()));
  const rowsToInsert = [];
  const initialPayments = []; // {rollNo, amount}
  dataLines.forEach((line)=>{
    const parts = line.split(',').map(p=>p.trim());
    const rollNo = getVal(parts,'rollno');
    const name = toTitleCase(getVal(parts,'name'));
    if (!rollNo || !name || existingRolls.has(rollNo.toLowerCase())){ skipped++; return; }
    if (existingNames.has(name.toLowerCase())) nameDupes++;
    const room = getVal(parts,'room');
    const gender = getVal(parts,'gender').toLowerCase();
    const batchText = getVal(parts,'batch');
    const batch = findBatchByCodeOrName(batchText);
    if (batchText && !batch) batchMisses++;
    const cashAmt = Math.max(0,parseFloat(getVal(parts,'cashpaid'))||0);
    const onlineAmt = Math.max(0,parseFloat(getVal(parts,'onlinepaid'))||0);
    if (cashAmt>0||onlineAmt>0) initialPayments.push({ rollNo, cashAmt, onlineAmt, uid:getVal(parts,'onlineuid'), bank:getVal(parts,'onlinebank') });
    rowsToInsert.push({ roll_no:rollNo, name, room,
      gender: ['male','female','other'].includes(gender) ? gender : null,
      batch_id: batch?batch.id:null,
      father_name:toTitleCase(getVal(parts,'fathername')), mother_name:toTitleCase(getVal(parts,'mothername')),
      addr_village_town:toTitleCase(getVal(parts,'villagetown')), addr_po:toTitleCase(getVal(parts,'po')),
      addr_ps:toTitleCase(getVal(parts,'ps')), addr_district:toTitleCase(getVal(parts,'district')), addr_state:toTitleCase(getVal(parts,'state')), addr_pin:getVal(parts,'pin'),
      contacts: parseContactsField(getVal(parts,'contacts')),
      fee_mode: (getVal(parts,'feemode').toLowerCase()==='monthly'?'monthly':'onetime'),
      fee_total:parseFloat(getVal(parts,'feetotal'))||0, fee_paid:0 });
    existingRolls.add(rollNo.toLowerCase());
    existingNames.add(name.toLowerCase());
    added++;
  });
  try{
    if (rowsToInsert.length) await sbInsert('students', rowsToInsert);
    if (initialPayments.length){
      toast(`Adding ${added} student(s) — recording ${initialPayments.length} initial payment(s)…`,'success');
      for (let i=0; i<initialPayments.length; i+=10){
        const chunk = initialPayments.slice(i, i+10);
        await Promise.all(chunk.map(p => sbRpc('record_split_payment', { p_roll_no:p.rollNo, p_cash_amount:p.cashAmt||0, p_online_amount:p.onlineAmt||0, p_uid:p.uid||'', p_bank:p.bank||'' }).catch(()=>{})));
      }
    }
    await sbInsert('activity_log', { type:'student_add', details:`Bulk import: ${added} added, ${skipped} skipped${batchMisses?`, ${batchMisses} batch reference(s) not found`:''}${nameDupes?`, ${nameDupes} name match(es) with existing students`:''}`, by_name: state.user.name });
    closeModal();
    toast(`${added} student(s) added${skipped?`, ${skipped} skipped`:''}${batchMisses?`, ${batchMisses} batch code(s) not matched`:''}${nameDupes?`. Note: ${nameDupes} share a name with an existing student — worth a quick check.`:''}`,'success');
    await Promise.all([loadStudents(), loadActivity()]);
  }catch(e){ toast(e.message,'error'); }
  update();
}

function fmtDateOnly(isoDate){
  if (!isoDate) return '';
  const d = new Date(isoDate + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtDuration(fromIso){
  if (!fromIso) return '';
  const ms = Date.now() - new Date(fromIso).getTime();
  if (ms < 0) return '0m';
  const mins = Math.floor(ms/60000);
  const days = Math.floor(mins/1440);
  const hours = Math.floor((mins%1440)/60);
  const remMins = mins%60;
  if (days>0) return `${days}d ${hours}h`;
  if (hours>0) return `${hours}h ${remMins}m`;
  return `${remMins}m`;
}

/* ============================================================
   ATTENDANCE — scan once per student per day; a repeat scan
   the same day is rejected with a clear error (date-wise, in
   the student's local calendar day, not the server's).
   ============================================================ */
function computeAttendanceGenderStats(markedList){
  const activeStudents = state.students.filter(s=>!s.archived);
  const outIds = new Set(state.leaves.filter(l=>l.status==='out').map(l=>l.student_id));
  const markedByStudent = {}; markedList.forEach(a=>{ markedByStudent[a.student_id] = a; });
  const s = { malePresent:0, femalePresent:0, maleInCampus:0, femaleInCampus:0, maleOut:0, femaleOut:0, maleAbsent:0, femaleAbsent:0, absentList:[], presentList:[] };
  activeStudents.forEach(st=>{
    const g = st.gender;
    const isOut = outIds.has(st.id);
    const isMarked = !!markedByStudent[st.id];
    if (g==='male' || g==='female'){
      if (isMarked){ if (g==='male') s.malePresent++; else s.femalePresent++; }
      if (isOut){ if (g==='male') s.maleOut++; else s.femaleOut++; }
      else {
        if (g==='male') s.maleInCampus++; else s.femaleInCampus++;
        if (!isMarked){ if (g==='male') s.maleAbsent++; else s.femaleAbsent++; }
      }
    }
    if (isMarked) s.presentList.push(st);
    else if (!isOut) s.absentList.push(st);
  });
  return s;
}

async function loadAssignments(){ try{ state._assignments = await sbSelect('assignments', '?select=*&order=created_at.desc'); }catch(e){ state._assignments=[]; } }
async function loadAssignmentRecords(assignmentId){ try{ return await sbSelect('assignment_records', `?assignment_id=eq.${assignmentId}&select=*,students(roll_no,name)&order=created_at.desc`); }catch(e){ return []; } }
function renderAssignmentsTab(){

    <div class="sc-meta"><span class="muted">by ${esc(a.created_by_name||'')}</span><span class="muted">${fmtTime(a.created_at)}</span></div>
  </div>`).join('') : '<p class="empty-hint">No assignments yet.</p>'}</div>`;
}

function startAssignmentScan(){ assignmentSessionCount = 0; state.scanning=true; update(); setTimeout(initCamera,60); }
function stopAssignmentScan(){
  stopCamera(); state.scanning=false; update();
  loadAssignmentRecords(state.openAssignmentId).then(list=>{ state._assignmentRecords=list; update(); });
}
async function recordAssignmentScan(code, sessionKey){
  const normalized = String(code).trim();
  const key = sessionKey || (state.openAssignmentId+':'+normalized.toLowerCase());
  const viaCamera = state.scanning;
  try{
    let rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase());
    if (!rows.length){ await refreshOneStudent(normalized); rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase()); }
    if (!rows.length){
      buzz([30,30,30]); assignmentErrorCooldown[key]=Date.now();
      if (viaCamera) showAsnFeedback('error', `No match: ${normalized}`); else toast(`No student matches code "${normalized}".`,'error');
      return;
    }
    const student = rows[0];
    await sbRpc('record_assignment_scan', { p_assignment_id: state.openAssignmentId, p_roll_no: student.roll_no });
    buzz(60);
    assignmentSessionResolved.add(key);
    if (viaCamera){
      if (!state._assignmentRecords) state._assignmentRecords = [];
      state._assignmentRecords.unshift({ id:'local-'+Date.now(), assignment_id: state.openAssignmentId, student_id: student.id, recorded_by_name: state.user.name, created_at: new Date().toISOString(), students:{ roll_no: student.roll_no, name: student.name } });
      assignmentSessionCount++;
      const counterEl = document.getElementById('asn-session-counter'); if (counterEl) counterEl.textContent = assignmentSessionCount;
      showAsnFeedback('success', student.name);
    } else {
      toast(`✓ ${student.name} recorded.`,'success');
      loadAssignmentRecords(state.openAssignmentId).then(list=>{ state._assignmentRecords=list; update(); });
    }
  }catch(e){
    buzz([30,30,30]);
    if (/already been recorded/i.test(e.message||'')) assignmentSessionResolved.add(key);
    else assignmentErrorCooldown[key] = Date.now();
    if (viaCamera) showAsnFeedback('error', e.message); else toast(e.message,'error');
  }
}
let asnFeedbackTimer = null;
function showAsnFeedback(type, text){
  const holder = document.getElementById('asn-feedback-holder');
  if (!holder) return;
  holder.className = 'scan-feedback ' + (type==='success' ? 'scan-feedback-ok' : 'scan-feedback-err');
  holder.innerHTML = `<div class="scan-feedback-icon">${type==='success'?'✓':'✕'}</div><div class="scan-feedback-text">${esc(text)}</div>`;
  holder.style.display = 'flex';
  if (asnFeedbackTimer) clearTimeout(asnFeedbackTimer);
  asnFeedbackTimer = setTimeout(()=>{ holder.style.display='none'; holder.innerHTML=''; }, 650);
}
function setAttDate(d){
  state.attDate = d || localDateStr();
  loadAttendanceForDate(state.attDate).then(list=>{ state._attendanceList=list; update(); });
  update();
}
let attFeedbackTimer = null;
function showAttFeedback(type, text){
  const holder = document.getElementById('att-feedback-holder');
  if (!holder) return; // camera not on screen right now — nothing to show this on
  holder.className = 'scan-feedback ' + (type==='success' ? 'scan-feedback-ok' : 'scan-feedback-err');
  holder.innerHTML = `<div class="scan-feedback-icon">${type==='success'?'✓':'✕'}</div><div class="scan-feedback-text">${esc(text)}</div>`;
  holder.style.display = 'flex';
  if (attFeedbackTimer) clearTimeout(attFeedbackTimer);
  attFeedbackTimer = setTimeout(()=>{ holder.style.display='none'; holder.innerHTML=''; }, 650);
}
async function markAttendance(code, sessionKey){
  const normalized = String(code).trim();
  const key = sessionKey || normalized.toLowerCase();
  if (!normalized){ toast('Enter a roll number first.','error'); return; }
  const viaCamera = state.scanning;
  try{
    let rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase());
    if (!rows.length){ await refreshOneStudent(normalized); rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase()); }
    if (!rows.length){
      buzz([30,30,30]);
      attendanceErrorCooldown[key] = Date.now();
      if (viaCamera) showAttFeedback('error', `No match: ${normalized}`); else toast(`No student matches code "${normalized}".`,'error');
      return;
    }
    const student = rows[0];
    const today = localDateStr();
    await sbRpc('mark_attendance', { p_roll_no: student.roll_no, p_date: today });
    buzz(60);
    attendanceSessionResolved.add(key);
    state.attDate = today;
    if (viaCamera){
      // Record locally WITHOUT a full re-render — re-rendering while the
      // camera is live would tear down and recreate its video element,
      // leaving the feed dark until the camera is restarted.
      if (!state._attendanceList) state._attendanceList = [];
      state._attendanceList.push({ id:'local-'+Date.now()+'-'+key, student_id: student.id, att_date: today, marked_by_name: state.user.name, created_at: new Date().toISOString(), students:{ roll_no: student.roll_no, name: student.name } });
      attendanceSessionCount++;
      const counterEl = document.getElementById('att-session-counter');
      if (counterEl) counterEl.textContent = attendanceSessionCount;
      showAttFeedback('success', student.name);
    } else {
      toast(`✓ ${student.name} marked present.`,'success');
      const list = await loadAttendanceForDate(today);
      state._attendanceList = list;
      update();
    }
  }catch(e){
    buzz([30,30,30]);
    if (/already marked/i.test(e.message||'')) attendanceSessionResolved.add(key); // known resolved state — no point retrying
    else attendanceErrorCooldown[key] = Date.now(); // e.g. out of campus — allow a retry later, just not every frame
    if (viaCamera) showAttFeedback('error', e.message); else toast(e.message,'error');
  }
}

async function loadAllPayments(from, to){
  let q = '?select=*,students(roll_no,name)&order=created_at.desc&limit=1000';
  if (from) q += `&created_at=gte.${from}T00:00:00`;
  if (to) q += `&created_at=lte.${to}T23:59:59`;
  try{ return await sbSelect('payments', q); }catch(e){ return []; }
}
function renderTransactionsTab(){
  if (!state._allPayments){ loadAllPayments(state.txnDateFrom, state.txnDateTo).then(p=>{ state._allPayments=p; update(); }); return `<div class="card"><p class="empty-hint">Loading transactions…</p></div>`; }
  const isRecycle = state.txnView==='recycle';
  const byView = state._allPayments.filter(p=> isRecycle ? p.archived : !p.archived);
  const filtered = filterByDate(byView, state.txnDateFrom, state.txnDateTo, 'created_at');

  const cappedWarning = state._allPayments.length>=1000 ? `<p class="muted" style="color:var(--amber);">⚠ Showing the most recent 1000 matching transactions — narrow the date range above to see everything in a busy period.</p>` : '';

    <div class="manual-row">

      <div class="segmented">
        <button class="${!isRecycle?'active':''}" onclick="setTxnView('active')">Active</button>
        <button class="${isRecycle?'active':''}" onclick="setTxnView('recycle')">Recycle bin</button>
      </div>
    </div>
    <div class="toolbar-actions"><span class="muted">Total: <b>${fmtMoney(total)}</b></span><button class="btn btn-secondary" onclick="state._allPayments=null; update();">Refresh</button></div>
  </div>
  <div class="card no-pad"><table class="table"><thead><tr><th>Txn ID</th><th>Student</th><th>Amount</th><th>Method</th><th>Details</th><th>By</th><th>When</th><th></th></tr></thead>
    <tbody>${filtered.length? filtered.map(p=>{ const stu=p.students||{}; return `<tr style="cursor:pointer;" onclick="openTransactionDetail('${escAttr(p.id)}','all',${isRecycle})">
      <td data-label="Txn ID" class="mono muted">${esc(p.txn_ref||'—')}</td>
      <td data-label="Student">${esc(stu.name||'')} <span class="muted mono">${esc(stu.roll_no||'')}</span></td>
      <td data-label="Amount">${fmtMoney(p.amount)}</td>
      <td data-label="Method"><span class="badge badge-${p.payment_method==='discount'?'discount':'payment'}">${esc(p.payment_method||'cash')}</span></td>
      <td data-label="Details" class="muted">${p.payment_method==='online'? esc((p.bank_name||'')+(p.transaction_uid?' · '+p.transaction_uid:'')) : esc(p.note||'')}</td>

      <td data-label="When" class="muted">${fmtTime(p.created_at)}</td>
      <td data-label="" class="row-actions" onclick="event.stopPropagation()">${p.payment_method==='discount' ? '' : isRecycle? `<button class="icon-btn" onclick="restorePaymentAction('${escAttr(p.id)}','all')">Restore</button>` : `<button class="icon-btn" onclick="openEditPaymentModal('${escAttr(p.id)}','all')">Edit</button><button class="icon-btn icon-danger" onclick="archivePaymentAction('${escAttr(p.id)}','all')">Bin</button>`}</td>
    </tr>`; }).join('') : `<tr><td colspan="8" class="empty-hint">No transactions in this range.</td></tr>`}</tbody></table></div>`;

function onEpMethodChange(){ const v=document.getElementById('ep-method').value; document.getElementById('ep-online-fields').style.display = v==='online'?'grid':'none'; }
async function submitEditPayment(id){
  const amount = parseFloat(document.getElementById('ep-amount').value);
  const method = document.getElementById('ep-method').value;
  const uid = document.getElementById('ep-uid') ? document.getElementById('ep-uid').value.trim() : '';
  const bank = document.getElementById('ep-bank') ? document.getElementById('ep-bank').value.trim() : '';

function onLogoFileSelected(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      // Resize to a small fixed square so the stored value stays tiny and QR rendering stays fast
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
      const scale = Math.min(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      const dataUrl = canvas.toDataURL('image/png');
      if (state.modal) state.modal.preview = dataUrl;
      const holder = document.getElementById('logo-preview-holder');
      if (holder) holder.innerHTML = `<img src="${dataUrl}" alt="" />`;
      const btn = document.getElementById('logo-save-btn'); if (btn) btn.disabled = false;
    };
    img.onerror = ()=> toast('Could not read that image.','error');
    img.src = e.target.result;
  };
  reader.onerror = ()=> toast('Could not read that file.','error');
  reader.readAsDataURL(file);
}

function startScan(){ attendanceSessionCount = 0; state.scanning=true; update(); setTimeout(initCamera,60); }
function initCamera(){
  if (typeof Html5Qrcode==='undefined'){ toast('Camera library failed to load. Check your connection and reload.','error'); state.scanning=false; update(); return; }
  try{
    html5QrCode = new Html5Qrcode('qr-reader');
    html5QrCode.start({ facingMode:'environment' }, { fps:10, qrbox:240 }, (decodedText)=>{ handleScanSuccess(decodedText); }, ()=>{})
      .catch(err=>{ toast('Could not access the camera: '+(err.message||err),'error'); state.scanning=false; update(); });
  }catch(err){ toast('Could not start the camera.','error'); state.scanning=false; update(); }
}
function stopCamera(){ if (html5QrCode){ try{ html5QrCode.stop().then(()=>{ try{ html5QrCode.clear(); }catch(e){} }).catch(()=>{}); }catch(e){} } }
function cancelScan(){
  const wasAttendance = currentScanMode()==='attendance';
  stopCamera(); state.scanning=false; update();
  if (wasAttendance){ loadAttendanceForDate(state.attDate||localDateStr()).then(list=>{ state._attendanceList=list; update(); }); }
}
function handleScanSuccess(decodedText){
  const mode = currentScanMode();
  if (mode==='attendance'){
    const key = decodedText.trim().toLowerCase();
    if (attendanceSessionResolved.has(key)) return; // already handled this session — stay completely silent
    if (attendancePending.has(key)) return; // a request for this code is already in flight
    const lastErr = attendanceErrorCooldown[key];
    if (lastErr && (Date.now()-lastErr) < 15000) return; // recently showed a retryable error for this code — wait before trying again
    attendancePending.add(key);
    markAttendance(decodedText, key).finally(()=>{ attendancePending.delete(key); });
    return; // keep the camera running for the next student
  }
  if (mode==='assignment'){
    const key = state.openAssignmentId + ':' + decodedText.trim().toLowerCase();
    if (assignmentSessionResolved.has(key)) return;
    if (assignmentPending.has(key)) return;
    const lastErr = assignmentErrorCooldown[key];
    if (lastErr && (Date.now()-lastErr) < 15000) return;
    assignmentPending.add(key);
    recordAssignmentScan(decodedText, key).finally(()=>{ assignmentPending.delete(key); });
    return; // keep the camera running for the next student
  }
  stopCamera(); state.scanning=false;
  if (mode==='gate') gateLookup(decodedText);
  else scanLookup(decodedText);
}
function submitManualLookup(){
  const val=document.getElementById('manual-roll').value.trim(); if(!val){ toast('Enter a roll number first.','error'); return; }
  const mode = currentScanMode();
  if (mode==='gate') gateLookup(val);
  else if (mode==='attendance') markAttendance(val);
  else if (mode==='assignment') recordAssignmentScan(val);
  else scanLookup(val);
}
async function scanLookup(code){
  const normalized = String(code).trim();

    let rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase());
    if (!rows.length){ await refreshOneStudent(normalized); rows = state.students.filter(s=>s.roll_no.toLowerCase()===normalized.toLowerCase()); }
    if (rows.length){
      buzz(60);
      sbRpc('log_scan', { p_roll_no: rows[0].roll_no, p_student_name: rows[0].name }).then(()=>loadActivity()).catch(()=>{});
      openStudentProfile(rows[0].roll_no);
    } else {
      toast(`No student matches code "${normalized}".`,'error');
    }
  }catch(e){ toast('Lookup failed: '+e.message,'error'); }
}

async function recordPayment(rollNo){
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const method = document.getElementById('pay-method').value;
  const uid = document.getElementById('pay-uid') ? document.getElementById('pay-uid').value.trim() : '';
  const bank = document.getElementById('pay-bank') ? document.getElementById('pay-bank').value.trim() : '';
  const note = document.getElementById('pay-note').value.trim();
  if (!amount || amount<=0){ toast('Enter a valid amount.','error'); return; }
  if (method==='online' && (!uid || !bank)){ toast('Enter the transaction UID and bank for online payments.','error'); return; }

  const recentPayments = (state.modal && state.modal.type==='profile' && state.modal.payments) || [];
  const dup = recentPayments.find(p => Number(p.amount)===amount && (Date.now()-new Date(p.created_at).getTime()) < 24*60*60*1000);
  if (dup){
    confirmAction(`A payment of ${fmtMoney(amount)} was already recorded for this student on ${fmtTime(dup.created_at)}${dup.recorded_by_name?' by '+dup.recorded_by_name:''}. This looks like it might be the same transaction — record it again anyway?`, ()=> actuallyRecordPayment(rollNo, amount, method, uid, bank, note));
    return;
  }
  await actuallyRecordPayment(rollNo, amount, method, uid, bank, note);
}
async function actuallyRecordPayment(rollNo, amount, method, uid, bank, note){
  const btn = document.getElementById('pay-btn'); if (btn){ btn.disabled=true; btn.textContent='Recording…'; }
  try{
    await sbRpc('record_payment', { p_roll_no: rollNo, p_amount: amount, p_note: note, p_method: method, p_uid: uid, p_bank: bank });
    closeModal();
    state._myPayments=null; state._allPayments=null;
    await refreshOneStudent(rollNo);
    await loadActivity();
    const updated = state.students.find(s=>s.roll_no.toLowerCase()===rollNo.toLowerCase());
    const nowDue = updated ? Math.max(0,(updated.fee_total||0)-(updated.fee_paid||0)) : null;
    if (nowDue===0){ buzz([50,40,50,40,80]); toast('Payment recorded — fully paid! 🎉','success'); }
    else { buzz(50); toast('Payment recorded.','success'); }
    openStudentProfile(rollNo);
  }catch(e){ toast(e.message,'error'); if (btn){ btn.disabled=false; btn.textContent='Record payment'; } }
}

    if (!r || !r.photo_path) return;
    const cached = photoUrlCache[r.photo_path];
    if (cached && cached.expiresAt > Date.now()){ el.innerHTML = `<img src="${cached.url}" alt="${esc(r.name||'')}" />`; return; }
    getCachedPhotoUrl(r.photo_path).then(url=>{
      if (!url || !el.isConnected) return;
      el.innerHTML = `<img src="${url}" alt="${esc(r.name||'')}" />`;
    });
  });
}

/* ============================================================
   MODAL DISPATCH
   ============================================================ */
function renderModal(){
  if (!state.modal) return '';
  switch(state.modal.type){
    case 'studentForm': return studentFormModalHTML(state.modal.existing, state.modal.contacts);
    case 'profile': return profileModalHTML(state.modal.student, state.modal.payments, state.modal.leaveHistory, state.modal.attendanceHistory);
    case 'archive': return archiveModalHTML(state.modal.rollNo);
    case 'bulkImport': return bulkImportModalHTML();
    case 'grantLeave': return grantLeaveModalHTML(state.modal.rollNo);
    case 'batches': return batchesModalHTML();
    case 'batchAssign': return batchAssignModalHTML(state.modal);
    case 'editPayment': return editPaymentModalHTML(state.modal.payment);
    case 'rowDetail': return rowDetailModalHTML(state.modal);
    case 'markFullPaid': return markFullPaidModalHTML(state.modal);
    case 'logHistoricalPayment': return logHistoricalPaymentModalHTML(state.modal);
    case 'newAssignment': return newAssignmentModalHTML();
    case 'missingPaymentCheck': return missingPaymentCheckModalHTML(state.modal);
    case 'logoUpload': return logoUploadModalHTML(state.modal);
    case 'changepw': return changePasswordModalHTML();
    case 'confirm': return `<div class="modal-overlay"><div class="modal modal-sm"><p>${esc(state.modal.message)}</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="runConfirmedAction()">Confirm</button></div></div></div>`;
    default: return '';
  }
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadTheme();
  await loadFontSize();
  render();
  applyFontSizeAttr();
  await loadConfig();
  if (!state.sbUrl || !state.sbAnonKey){ state.view='setup'; update(); return; }
  await loadPersistedSession();
  if (session){
    try{
      await getValidAccessToken();
      await loadMyProfile();
      if (state.user.role !== 'admin'){
        try{
          const approved = await sbSelect('login_requests', `?user_id=eq.${state.user.id}&device_id=eq.${DEVICE_ID}&status=eq.approved&select=id&limit=1`);
          if (!(approved && approved.length)){
            // This device isn't approved yet — check if it has a request already pending/denied
            const rows = await sbSelect('login_requests', `?user_id=eq.${state.user.id}&device_id=eq.${DEVICE_ID}&select=*&order=requested_at.desc&limit=1`);
            const latest = rows && rows[0];
            if (!latest || latest.status==='denied'){
              await requestLoginApproval();
              state.view='waiting-approval'; update(); startApprovalPolling(); return;
            } else if (latest.status==='pending'){
              state.myLoginRequestId = latest.id;
              state.view='waiting-approval'; update(); startApprovalPolling(); return;
            }
          }
        }catch(e){}
      }
      state.view='app';
      await loadAllForRole();
      startInactivityWatch();
      startDeviceHeartbeat();
    }catch(e){ await clearSession(); state.view='login'; }
  } else { state.view='login'; }
  update();
}
init();
</script>
